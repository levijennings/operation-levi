    // ── What moves this task forward? ────────────────────────────────────────
    // Levi's complaint was that nothing on the detail screen told him what to do
    // next. This computes exactly one answer, in priority order, and the bar at
    // the top of the screen renders it. `tone` picks the accent: amber only when
    // Wingman is the actor, red when the task is late, green when it is clear.
    function lpNextStep(card){
      var me=meName(), own=owner(card), sts=(card.subtasks||[]);
      var openSubs=sts.filter(function(x){ return !x.done; });
      var hasDraft=!!(card.aiArtifact&&card.aiArtifact.content);
      var today=new Date().toISOString().slice(0,10);
      var late=card.dueDate && card.dueDate<today && card.status!=='done';
      var daysLate=0; if(late){ try{ daysLate=Math.round((new Date(today)-new Date(card.dueDate))/86400000); }catch(e){} }

      if(card.status==='done')
        return {tone:'calm',key:'Complete',title:'This one is done.',why:'Reopen it if something came back.',acts:[{t:'↩ Reopen',id:'nsReopen'}]};

      if(card.requireProof && !(card.proof&&card.proof.url))
        return {tone:'',key:'Next',title:'Attach the proof, then it can be closed.',
          why:'You asked for a proof link on this one before it counts as done.',acts:[{t:'Add proof',id:'nsProof',amber:true}]};

      if(card.status==='review' && hasDraft)
        return {tone:'wing',key:'Waiting on you',title:'Wingman drafted this — it needs your call.',
          why:'Approve it, or say what to change and it will redo it.',
          acts:[{t:'✓ Approve',id:'nsApprove',amber:true},{t:'↩ Request changes',id:'nsReject'}]};

      if(lpIsTravel(card) && !hasDraft)
        return {tone:'wing',key:'Next',title:'This is a trip — Wingman can plan it.',
          why:'Flights, lodging and ground against your travel profile, then a booking list.',
          acts:[{t:'▸ Plan this trip',id:'nsTrip',amber:true}]};

      if(!card.deliverable)
        return {tone:'',key:'Next',title:'Set the end result.',
          why:'Wingman cannot help until it knows what this is supposed to produce.',acts:[{t:'Pick a deliverable',id:'nsDeliv',amber:true}]};

      if(card.execMode==='do-it' && !hasDraft)
        return {tone:'wing',key:'Next',title:'Wingman is set to draft this.',
          why:'It has everything it needs — run it and review what comes back.',acts:[{t:'▸ Run with Wingman',id:'nsRun',amber:true}]};

      if(card.status==='waiting')
        return {tone:'',key:'Blocked',title:'Waiting on '+esc(card.waitingFrom||card.waitingOn||'someone else')+'.',
          why:'Nothing moves here until that comes back.',acts:[{t:'Nudge them',id:'nsNudge'},{t:'Unblock it',id:'nsUnblock'}]};

      if(openSubs.length)
        return {tone:'',key:'Next step',title:esc(openSubs[0].title||'Finish the next subtask'),
          why:openSubs.length+' of '+sts.length+' steps left.',acts:[{t:'✓ Mark this step done',id:'nsSub',amber:true}]};

      if(late)
        return {tone:'late',key:'Overdue',title:'Past due by '+daysLate+' day'+(daysLate===1?'':'s')+'.',
          why:'Reset the date to something real, or hand it to someone who can move it.',
          acts:[{t:'Reset the date',id:'nsDate',amber:true},{t:'Hand it off',id:'nsHand'}]};

      if(!card.dueDate)
        return {tone:'',key:'Next',title:'No due date.',
          why:'Without one it will not surface on Today and it cannot go overdue.',acts:[{t:'Set a date',id:'nsDate',amber:true}]};

      if(own && own!==me)
        return {tone:'',key:'With the crew',title:esc(own)+' owns this.',
          why:'Due '+esc(lpDueFull(card.dueDate))+'. Check in if it has gone quiet.',acts:[{t:'Check in',id:'nsNudge'}]};

      return {tone:'calm',key:'Clear',title:'Nothing is blocking this.',
        why:'Due '+esc(lpDueFull(card.dueDate))+'. Finish it and mark it done.',acts:[{t:'✓ Mark done',id:'nsDone',amber:true}]};
    }
    function lpNextBarHtml(card){
      var n=lpNextStep(card);
      // Overdue colours whatever the step is, rather than replacing it — the action
      // is still the action, you just need to see that it is late while you read it.
      try{

        if(card.status!=='done' && card.dueDate && card.dueDate<t0 && n.key!=='Overdue'){
          var dl=Math.round((new Date(t0)-new Date(card.dueDate))/86400000);

        go.textContent='Sending…'; go.disabled=true; cancel.disabled=true; msg.style.display='none';
        var rawBody=String(bodyI.value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        var html=(typeof window.lpEmailWrap==='function')?window.lpEmailWrap(rawBody,{preheader:(subI.value||'')}):rawBody;
        fetch('/api/send',{method:'POST',headers:apiHeaders(),body:JSON.stringify({to:toI.value.trim(),cc:ccI.value.trim(),subject:subI.value,html:html,text:bodyI.value})})
          .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
          .then(function(res){
            go.textContent='Confirm & send'; go.disabled=false; cancel.disabled=false;
            if(res.ok){ it.aiStatus='sent'; if(!it.aiArtifact) it.aiArtifact={}; it.aiArtifact.sentAt=Date.now(); it.aiArtifact.sentTo=toI.value.trim(); it.aiArtifact.sentVia='resend'; it.status='done'; it.columnEnteredAt=Date.now(); persist(); try{ if(typeof renderBoard==='function') renderBoard(); }catch(e){} toast('✉ Sent to '+toI.value.trim()); try{document.body.removeChild(ov);}catch(e){} showBoard(); }
            else if(res.status===503&&res.j&&res.j.error==='no_key'){ showFallback('Add <b>RESEND_API_KEY</b> in Vercel (and verify a dvlmnt.com sender) to send automatically.'); }
            else if(res.j&&res.j.error==='no_from'){ showFallback('Verify a sender for <b>dvlmnt.com</b> in Resend and set <b>RESEND_FROM</b> in Vercel.'); }
            else { msg.style.display='block'; msg.style.color='#E08A8A'; msg.textContent='Send failed: '+((res.j&&(res.j.detail||res.j.error))||('HTTP '+res.status)); }
          }).catch(function(e){ go.textContent='Confirm & send'; go.disabled=false; cancel.disabled=false; msg.style.display='block'; msg.style.color='#E08A8A'; msg.textContent='Network error: '+(e&&e.message||e); });
      };
      btns.appendChild(cancel); btns.appendChild(go); box.appendChild(btns);
      ov.appendChild(box); ov.onclick=function(e){ if(e.target===ov) document.body.removeChild(ov); }; document.body.appendChild(ov);
    }

    // ── Voice-first capture ──
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, listening=false, capMode='track-it', capDraft=null;
    var cap=document.createElement('div'); cap.className='ol2cap'; cap.id='ol2cap';
    cap.innerHTML=
      '<div class="cap">'+
        '<div class="mic" id="ol2capMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>'+
        '<h3 id="ol2capH">Speak a task</h3><div class="sub" id="ol2capSub">Tap the mic and talk — or type below</div>'+
        '<div class="wave" id="ol2capWave"></div>'+
        '<textarea id="ol2capTa" placeholder="e.g. Draft a proposal for Acme for the website redesign, due Friday"></textarea>'+
        '<div class="cerr" id="ol2capErr"></div>'+
        '<div class="pv" id="ol2capPv">'+
          '<div class="pt">✦ Card preview <span style="font-size:10.5px;color:#8A8D97;border:1px solid #30353d;border-radius:6px;padding:2px 7px;margin-left:4px">confirm to save</span></div>'+
          '<div class="prow"><span>Title</span><b id="ol2pvTitle"></b></div>'+
          '<div class="prow"><span>Due</span><b id="ol2pvDue"></b></div>'+
          '<div class="prow"><span>Owner</span><b id="ol2pvOwner"></b></div>'+
          '<div class="prow"><span>Category</span><b id="ol2pvCat"></b></div>'+
          '<div class="prow"><span>Context</span><b id="ol2pvCtx"></b></div>'+
          '<div id="ol2pvParts"></div>'+
          '<div class="modes" id="ol2capModes"><div class="mode" id="ol2mDo">▸ Do-it · Wingman drafts</div><div class="mode" id="ol2mTrack">◷ Track-it · you do</div></div>'+
        '</div>'+
        '<div class="cact" id="ol2capAct1"><button class="gbtn" id="ol2capCancel">Cancel</button><button class="gbtn amber" id="ol2capCont">Continue →</button></div>'+
        '<div class="cact" id="ol2capAct2" style="display:none"><button class="gbtn" id="ol2capBack">← Edit</button><button class="gbtn amber" id="ol2capConfirm">Confirm — let Wingman draft it</button></div>'+
      '</div>';
    document.body.appendChild(cap);
    for(var wi=0;wi<22;wi++){ cap.querySelector('#ol2capWave').appendChild(document.createElement('i')); }
    function $c(id){ return cap.querySelector('#'+id); }
    function people(){ try{ return (typeof getAllAssignees==='function'?(getAllAssignees()||[]):[]); }catch(e){ return []; } }
    function cats(){ try{ return (typeof teams!=='undefined'&&teams)?Object.keys(teams):['Personal']; }catch(e){ return ['Personal']; } }
    function meName(){ try{ return (typeof _userName!=='undefined'&&_userName)?_userName:'Levi'; }catch(e){ return 'Levi'; } }
    function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function parseDue(low){ var now=new Date(); now.setHours(0,0,0,0);
      if(/\btoday\b/.test(low)) return fmt(now);
      if(/\btomorrow\b/.test(low)){ var d=new Date(now); d.setDate(d.getDate()+1); return fmt(d); }
      if(/\bnext week\b/.test(low)){ var d2=new Date(now); d2.setDate(d2.getDate()+7); return fmt(d2); }
      var days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
      for(var i=0;i<7;i++){ if(new RegExp('\\b'+days[i]+'\\b').test(low)){ var d3=new Date(now); var add=(i-d3.getDay()+7)%7; if(add===0) add=7; d3.setDate(d3.getDate()+add); return fmt(d3); } }
      if(/\bend of (the )?week\b|\beow\b/.test(low)){ var d4=new Date(now); var a4=(5-d4.getDay()+7)%7; d4.setDate(d4.getDate()+a4); return fmt(d4); }
      return '';
    }
    function setLive(v){ listening=v; $c('ol2capMic').classList.toggle('live',v); $c('ol2capWave').style.visibility=v?'visible':'hidden'; if(!$c('ol2capPv').classList.contains('on')) $c('ol2capH').textContent=v?'Listening…':'Speak a task'; }
    function startRec(){ if(!SR){ var er=$c('ol2capErr'); er.style.display='block'; er.textContent="Voice input isn’t supported here — type your task below."; return; } try{ rec=new SR(); }catch(e){ return; } rec.lang='en-US'; rec.interimResults=true; rec.continuous=false; rec.onresult=function(e){ var t=''; for(var i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; } $c('ol2capTa').value=t; }; rec.onerror=function(e){ setLive(false); if(e&&e.error==='not-allowed'){ var er2=$c('ol2capErr'); er2.style.display='block'; er2.textContent='Microphone blocked — allow mic access or type below.'; } }; rec.onend=function(){ setLive(false); }; try{ rec.start(); setLive(true); $c('ol2capErr').style.display='none'; }catch(e){} }
    function stopRec(){ try{ if(rec&&listening) rec.stop(); }catch(e){} setLive(false); }
    function setCapMode(m){ capMode=m; $c('ol2mDo').classList.toggle('sel',m==='do-it'); $c('ol2mTrack').classList.toggle('sel',m==='track-it'); }
    function openCapture(opts){ opts=opts||{}; if(!shell.classList.contains('on')){ shell.classList.add('on'); showBoard(); } cap.classList.add('on'); $c('ol2capTa').value=''; $c('ol2capErr').style.display='none'; $c('ol2capPv').classList.remove('on'); $c('ol2capAct1').style.display='flex'; $c('ol2capAct2').style.display='none';
      if(opts.type){ $c('ol2capH').textContent='New task'; $c('ol2capSub').textContent='Type it — Wingman will structure it. Tap the mic to talk instead.'; setTimeout(function(){ try{ $c('ol2capTa').focus(); }catch(e){} },200); }
      else { $c('ol2capH').textContent='Speak a task'; $c('ol2capSub').textContent='Tap the mic and talk — or type below'; setTimeout(startRec,250); } }
    function closeCapture(){ stopRec(); cap.classList.remove('on'); }
    function ctxMatch(low){ var ctx=null; try{ (L().context||[]).forEach(function(c){ if(!ctx && c.name && low.indexOf(String(c.name).toLowerCase())>=0) ctx=c; }); }catch(e){} return ctx; }
    function ownerCycle(){ var me=meName(); return ['me','Wingman'].concat(people().filter(function(p){ return p!==me; })); }
    function partChip(p){
      if(p.suggestedOwner==='Wingman') return '<button type="button" class="cap-own wg">▸ Wingman'+(p.confidence?(' '+p.confidence+'%'):'')+'</button>';
      if(p.suggestedOwner==='me') return '<button type="button" class="cap-own me">You</button>';
      return '<button type="button" class="cap-own team">'+esc(p.suggestedOwner)+'</button>';
    }
    function renderParts(){
      var box=$c('ol2pvParts'); if(!box) return;
      var parts=(capDraft&&capDraft.parts)||[];
      if(parts.length<2){ box.innerHTML=''; $c('ol2capModes').style.display='flex'; $c('ol2capConfirm').textContent='Confirm — let Wingman draft it'; return; }
      $c('ol2capModes').style.display='none';
      var nW=parts.filter(function(p){ return p.suggestedOwner==='Wingman'; }).length;
      box.innerHTML='<div style="font-size:10px;letter-spacing:.14em;color:#8A8D97;margin:10px 0 6px">WINGMAN SPLIT THIS INTO '+parts.length+' PARTS — TAP AN OWNER TO CHANGE IT</div>'+
        parts.map(function(p,i){ return '<div class="cap-part" data-i="'+i+'"><span class="t">'+esc(p.title)+(p.deliverable?('<em>'+esc(p.deliverable)+'</em>'):'')+'</span>'+partChip(p)+'</div>'; }).join('');
      box.querySelectorAll('.cap-own').forEach(function(btn){
        btn.onclick=function(ev){ ev.stopPropagation(); var row=btn.closest('.cap-part'); var i=parseInt(row.getAttribute('data-i'),10); var cyc=ownerCycle(); var cur=capDraft.parts[i].suggestedOwner; var next=cyc[(cyc.indexOf(cur)+1)%cyc.length]; capDraft.parts[i].suggestedOwner=next; renderParts(); };
      });
      $c('ol2capConfirm').textContent='Create '+parts.length+' parts'+(nW?(' · Wingman drafts '+nW):'');
    }
    function renderPreview(){
      $c('ol2pvTitle').textContent=capDraft.title; $c('ol2pvDue').textContent=capDraft.due||'—';
      $c('ol2pvOwner').textContent=capDraft.owner||meName();
      $c('ol2pvCat').textContent=capDraft.cat+(capDraft.deliverable?(' · '+capDraft.deliverable):'');
      $c('ol2pvCtx').textContent=capDraft.ctx?capDraft.ctx.name:'—';
      var single=(capDraft.parts||[]).length<2 ? (capDraft.parts&&capDraft.parts[0]) : null;
      setCapMode((single&&single.suggestedOwner==='Wingman')||capDraft.doit?'do-it':'track-it');
      renderParts();
      $c('ol2capPv').classList.add('on'); $c('ol2capAct1').style.display='none'; $c('ol2capAct2').style.display='flex';
      $c('ol2capH').textContent='Got it — here’s the plan'; $c('ol2capSub').textContent=capDraft.ai?'Wingman structured it. Adjust owners, then confirm.':'Wingman structured your sentence. Confirm to save.';
      var el=document.getElementById('ol2capAssess'); if(!el){ el=document.createElement('div'); el.id='ol2capAssess'; el.style.cssText='margin-top:10px;font-size:12.5px;color:#9EA1AB'; $c('ol2capPv').appendChild(el); }
      if(capDraft.ai){ el.innerHTML=capDraft.clarify?('<span style="color:#C08428">Wingman asks: '+esc(capDraft.clarify)+'</span> <span style="color:#8A8D97">— add detail in notes later, or confirm as-is.</span>'):''; }
      else el.textContent='';
    }
    function capParseLocal(text){
      var low=text.toLowerCase();
      var due=parseDue(low); var pl=people(), own=meName();
      for(var i=0;i<pl.length;i++){ var nm=String(pl[i]).toLowerCase().replace(/[^a-z0-9]/g,''); if(nm && new RegExp('\\b'+nm+'\\b').test(low.replace(/[^a-z0-9 ]/g,''))){ own=pl[i]; break; } }
      var cl=cats(), cat=(cl.indexOf('Personal')>=0?'Personal':cl[0]);
      for(var j=0;j<cl.length;j++){ if(low.indexOf(String(cl[j]).toLowerCase())>=0){ cat=cl[j]; break; } }
      var doit=/\b(draft|write|writeup|summari[sz]e|research|generate|create|compose|prepare|email|reply|respond|outline|update|recap|brainstorm|plan)\b/.test(low);
      var title=text.replace(/,?\s*(due|by|before)\s+[a-z0-9 ]+$/i,'').replace(/\s+(today|tomorrow|next week)\b/ig,'').trim(); if(!title) title=text; title=title.charAt(0).toUpperCase()+title.slice(1);
      var deliv=inferDeliverable(low);
      capDraft={title:title, due:due, owner:own, cat:cat, ctx:ctxMatch(low), deliverable:deliv, doit:doit, ai:false, parts:[], notes:''};
      renderPreview();
      lpAssess({title:capDraft.title,notes:'',category:capDraft.cat,deliverable:capDraft.deliverable||''},function(j){ var el=document.getElementById('ol2capAssess'); if(!el||!j||j.confidence==null) return; if(capDraft) capDraft.assess={confidence:Number(j.confidence),reason:j.reason||'',questions:j.questions||[],suggest:j.suggest||{}}; var cc=j.confidence>=75?'#3FA276':(j.confidence>=40?'#C08428':'#E08A8A'); el.innerHTML='<span style="color:'+cc+';font-weight:700">Wingman confidence: '+j.confidence+'%</span>'+(j.reason?(' — '+esc(j.reason)):''); });
    }
    function capParse(){
      var text=($c('ol2capTa').value||'').trim(); var er=$c('ol2capErr');
      if(!text){ er.style.display='block'; er.textContent='Say or type a task first.'; return; }
      er.style.display='none';
      // Phase 3: real Wingman structuring + decomposition (regex only as offline fallback)
      $c('ol2capH').textContent='▸ Wingman is structuring…'; $c('ol2capSub').textContent='Reading it, picking the deliverable, splitting the work.';
      var cont=$c('ol2capCont'); cont.disabled=true;
      fetch('/api/structure',{method:'POST',headers:apiHeaders(),body:JSON.stringify({text:text,people:people(),categories:cats(),me:meName()})})
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
        .then(function(res){
          cont.disabled=false;
          if(res.ok&&res.j&&res.j.title){
            var low=text.toLowerCase();
            capDraft={title:res.j.title, due:res.j.due||'', owner:res.j.owner||'', cat:res.j.category, ctx:ctxMatch(low), deliverable:res.j.deliverable||'', notes:res.j.notes||'', parts:res.j.parts||[], clarify:res.j.clarify||'', ai:true};
            renderPreview();
          } else { capParseLocal(text); }
        })
        .catch(function(){ cont.disabled=false; capParseLocal(text); });
    }
    function newItemBase(title, cat, due, deliverable, ownerName){
      return { id:'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), type:'task', title:title||'Untitled', category:cat||'Personal', status:'thisweek',
        startDate:'', dueDate:due||'', deliverable:deliverable||'', notes:'', priority:0, timeEstimate:0, tshirtSize:'XS',
        raci:{R:[],A:'',C:[],I:[]}, assignees:ownerName?[ownerName]:[], responsible:ownerName||'', responsible2:'', informed:[], involved:[], approver:'', informedWhenComplete:[],
        waitingOn:'', waitingFrom:'', waitingExpected:'', goalIds:[], approvers:[], meetings:[], subtasks:[], timeline:[], urls:[], documents:[], habitCompletions:[], recurring:false, recurringFrequency:'',
        columnEnteredAt:Date.now(), createdAt:Date.now(), order:999, notionUrl:'', figmaUrl:'', googleDocsUrl:'', msDocsUrl:'', msExcelUrl:'',
        execMode:'track-it', aiStatus:'idle', aiArtifact:null, aiUsed:null, linkedContext:[], parentItemId:'' };
    }
    function capConfirmParts(){
      var me=meName(); var d=capDraft;
      var parent=newItemBase(d.title, d.cat, d.due, d.deliverable, me);
      parent.type='project'; parent.notes=d.notes||''; if(d.ctx) parent.linkedContext=[d.ctx.name];
      var kids=[]; var nW=0;
      d.parts.forEach(function(p){
        var ownerName = (p.suggestedOwner==='me'||p.suggestedOwner==='Wingman') ? me : p.suggestedOwner;
        var kid=newItemBase(p.title, d.cat, d.due, p.deliverable||'', ownerName);
        kid.parentItemId=parent.id; if(d.ctx) kid.linkedContext=[d.ctx.name];
        if(p.suggestedOwner==='Wingman'){ kid.execMode='do-it'; kid.aiConfidence=p.confidence||null; kid.aiAssess=p.reason?{reason:p.reason,questions:[],suggest:{}}:null; nW++; }
        kids.push(kid);
      });
      try{ items.push(parent); kids.forEach(function(k){ items.push(k); }); }catch(e){}
      persist(); closeCapture(); showBoard();
      toast('▸ Mission created — '+kids.length+' parts'+(nW?(' · Wingman drafting '+nW):''));
      kids.forEach(function(k,i){
        if(k.execMode==='do-it'){ setTimeout(function(){ draftFor(k); }, i*400); }
        else if(k.responsible && k.responsible!==me){ lpNotifyAssign(k.responsible, k); }
      });
      capDraft=null;
    }
    function capConfirm(){
      if(!capDraft) return;
      if(capDraft.ai && capDraft.parts && capDraft.parts.length>1){ capConfirmParts(); return; }
      var p0=(capDraft.parts&&capDraft.parts[0])||null;
      if(p0){
        if(p0.suggestedOwner&&p0.suggestedOwner!=='me'&&p0.suggestedOwner!=='Wingman') capDraft.owner=p0.suggestedOwner;
        if(p0.deliverable&&!capDraft.deliverable) capDraft.deliverable=p0.deliverable;
        if(p0.confidence&&!capDraft.assess) capDraft.assess={confidence:p0.confidence,reason:p0.reason||'',questions:[],suggest:{}};
      }
      var own=capDraft.owner||meName();
      var it={ id:'v'+Date.now().toString(36), type:'task', title:capDraft.title||'Untitled', category:capDraft.cat||'Personal', status:'thisweek',
        startDate:'', dueDate:capDraft.due||'', deliverable:capDraft.deliverable||'', notes:'', priority:0, timeEstimate:0, tshirtSize:'XS',
        raci:{R:[],A:'',C:[],I:[]}, assignees:own?[own]:[], responsible:own||'', responsible2:'', informed:[], involved:[], approver:'', informedWhenComplete:[],
        waitingOn:'', waitingFrom:'', waitingExpected:'', goalIds:[], approvers:[], meetings:[], subtasks:[], timeline:[], urls:[], documents:[], habitCompletions:[], recurring:false, recurringFrequency:'',
        columnEnteredAt:Date.now(), createdAt:Date.now(), order:999, notionUrl:'', figmaUrl:'', googleDocsUrl:'', msDocsUrl:'', msExcelUrl:'',
        execMode:capMode, aiStatus:'idle', aiArtifact:null, aiUsed:null, linkedContext:capDraft.ctx?[capDraft.ctx.name]:[] };
      if(capDraft.assess){ it.aiConfidence=capDraft.assess.confidence; it.aiAssess={reason:capDraft.assess.reason,questions:capDraft.assess.questions,suggest:capDraft.assess.suggest}; }
      if(capDraft.notes) it.notes=capDraft.notes;
      try{ if(typeof items!=='undefined' && items && items.push) items.push(it); }catch(e){}
      persist(); closeCapture(); showBoard();
      if(own && own!==meName()) lpNotifyAssign(own, it);
      if(capMode==='do-it'){
        toast('▸ Card created — Wingman is drafting…');
        var parts=assemble(it);
        callRun(it, parts, '', '', function(res){
          if(res.ok&&res.j&&res.j.draft){ it.aiArtifact={kind:'draft',content:res.j.draft,model:res.j.model||'',createdAt:Date.now()}; it.aiStatus='ready'; it.status='review'; it.columnEnteredAt=Date.now(); persist(); if(shell.classList.contains('on')){ var rev=document.getElementById('ol2Review'); if(rev.style.display==='none') showBoard(); } toast('✦ Draft ready — in Needs review'); }
          else if(res.status===503&&res.j&&res.j.error==='no_key'){ toast('Card created — add ANTHROPIC_API_KEY to enable drafting'); }
          else { toast('Card created — couldn’t draft right now'); }
        });
      } else { toast('✓ Card added'); }
      capDraft=null;
    }
    window.ol2OpenCaptureTyped=function(){ openCapture({type:true}); };
    (function(){ var nb=document.getElementById('ol2New'); if(nb) nb.onclick=function(){ openCapture({type:true}); }; })();
    $c('ol2capMic').onclick=function(){ if(listening) stopRec(); else startRec(); };
    $c('ol2capCancel').onclick=closeCapture;
    $c('ol2capCont').onclick=function(){ stopRec(); capParse(); };
    $c('ol2capBack').onclick=function(){ $c('ol2capPv').classList.remove('on'); $c('ol2capAct1').style.display='flex'; $c('ol2capAct2').style.display='none'; $c('ol2capH').textContent='Speak a task'; $c('ol2capSub').textContent='Tap the mic and talk — or type below'; };
    $c('ol2capConfirm').onclick=capConfirm;
    $c('ol2mDo').onclick=function(){ setCapMode('do-it'); };
    $c('ol2mTrack').onclick=function(){ setCapMode('track-it'); };
    cap.onclick=function(e){ if(e.target===cap) closeCapture(); };
    window.ol2OpenCapture=openCapture;

    document.addEventListener('keydown',function(e){
      if(e.altKey&&e.code==='Space'){ e.preventDefault(); openCapture(); return; }
      if(e.key==='Escape'){ if(cap.classList.contains('on')){ closeCapture(); return; } if(shell.classList.contains('on')){ var rev=document.getElementById('ol2Review'); if(rev.style.display!=='none'){ showBoard(); } } }
    });
    window.ol2Refresh=function(){ if(shell.classList.contains('on')){ var rev=document.getElementById('ol2Review'); if(rev.style.display==='none') showBoard(); } };
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
