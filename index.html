    <style>
:root {
            /* Sidebar stays DVLMNT black */
            --sidebar: #060606;
            --sidebar-hover: #1C1C1C;
            --sidebar-active: rgba(255,255,255,.10);
            /* Content area — crisp white */
            --bg: #F5F5F5;
            --surface: #FFFFFF;
            --surface-2: #F4F4F5;
            --border: #E4E4E7;
            --border-2: #D1D1D6;
            --text: #0A0A0A;
            --text-2: #5A5A5A;
            --text-3: #9CA0A8;
            /* Accent — DVLMNT black on white bg */
            --accent: #0A0A0A;
            --accent-hover: #333333;
            --accent-subtle: rgba(0,0,0,.06);
            /* Category colors — vivid for white bg */
            --acst: #CC4F4F;
            --acst-subtle: #FEF2F2;
            --dvlmnt: #3FA276;
            --dvlmnt-subtle: #ECFDF5;
            --personal: #4F8AD1;
            --personal-subtle: #EFF6FF;
            --phone: #7C3AED;
            --phone-subtle: #F5F3FF;
            --meeting: #EA580C;
            --meeting-subtle: #FFF7ED;
            --success: #16A34A;
            --warn: #D97706;
            --danger: #CC4F4F;
            --radius: 8px;
            --radius-sm: 6px;
            --radius-xs: 4px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.05);

            --shadow-lg: 0 4px 16px rgba(0,0,0,.12);
            --transition: all .15s ease;
        }
[data-theme="dark"] {
            --bg: #0E0F12;
            --surface: #15161A;
            --surface-2: #191B20;
            --border: #26272D;
            --border-2: #30323A;
            --text: #E9EAEE;
            --text-2: #9EA1AB;
            --text-3: #6C6F79;
            --accent: #E9EAEE;
            --accent-hover: #FFFFFF;
            --accent-subtle: rgba(255,255,255,.08);
            --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
            --shadow: 0 1px 4px rgba(0,0,0,.6);
            --shadow-lg: 0 4px 16px rgba(0,0,0,.7);
            /* Category subtle — darkened tints for dark mode */
            --acst-subtle: rgba(204,79,79,0.18);
            --dvlmnt-subtle: rgba(63,162,118,0.18);
            --personal-subtle: rgba(79,138,209,0.18);
            --meeting-subtle: rgba(234,88,12,0.18);
        }
html,body{margin:0;padding:0;background:#0E0F12;color:#E9EAEE;font-family:'Inter',-apple-system,sans-serif}
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            box-shadow: var(--shadow-lg);
            animation: slideIn .2s ease;
        }

<body>
    <div id="authOverlay" style="position:fixed;inset:0;z-index:99999;background:#060606;display:flex;align-items:center;justify-content:center;font-family:'Inter',-apple-system,sans-serif;">
            <div style="background:#1C1C1C;border:1px solid #2a2a2a;border-radius:16px;padding:48px 40px;width:380px;max-width:90vw;text-align:center;">
                <div style="margin:0 auto 10px;width:52px;height:52px;"><svg viewBox="0 0 512 512" width="52" height="52"><rect width="512" height="512" rx="112" fill="#0A0A0A"/><path d="M150 120 H210 V332 H360 V392 H150 Z" fill="#fff"/><circle cx="300" cy="160" r="22" fill="#CC4F4F"/><circle cx="360" cy="160" r="22" fill="#3FA276"/><circle cx="330" cy="214" r="22" fill="#4F8AD1"/></svg></div>
                <h1 style="color:#F0F0F0;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.5px;">Levi's Projects</h1>
                <p style="color:#555;font-size:13px;margin-bottom:32px;">Sign in to your workspace</p>
                <input id="authEmail" type="email" placeholder="Email address" autocomplete="email"
                    style="width:100%;background:#252525;border:1px solid #333;border-radius:8px;padding:11px 14px;color:#F0F0F0;font-size:14px;margin-bottom:10px;outline:none;box-sizing:border-box;"
                    onkeydown="if(event.key==='Enter')document.getElementById('authPassword').focus()" />
                <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password"
                    style="width:100%;background:#252525;border:1px solid #333;border-radius:8px;padding:11px 14px;color:#F0F0F0;font-size:14px;margin-bottom:6px;outline:none;box-sizing:border-box;"
                    onkeydown="if(event.key==='Enter')signIn()" />

                    style="width:100%;background:#E0E0E0;color:#0A0A0A;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;">
                    Sign In

    <!-- TOAST CONTAINER -->
    <div id="toastContainer"></div>

    <!-- Supabase SDK — loaded before the main script so initAuth() can use it -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // PWA install prompt — captured as early as possible
        window._installPrompt = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            window._installPrompt = e;
        });
        window.addEventListener('appinstalled', () => {
            if (typeof showToast === 'function') showToast('✅ Levi\'s Projects installed!');
        });

        // ═══════════════════════════════════════════════════════════════════════════
        // SUPABASE CONFIGURATION — replace with your project values
        // ═══════════════════════════════════════════════════════════════════════════
        const SUPABASE_URL      = 'https://jtrqhihdjbhzbavsknht.supabase.co';       // e.g. https://xxxx.supabase.co
        const SUPABASE_ANON_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0cnFoaWhkamJoemJhdnNrbmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDU1MjcsImV4cCI6MjA5MjUyMTUyN30.4knBxgbJgiyNH-nm-XdmOJxTURRxuyHH9_HxxjaUdmI';  // public anon key from API settings

        // ═══════════════════════════════════════════════════════════════════════════
        // DATA MODEL & STORAGE
        // ═══════════════════════════════════════════════════════════════════════════
        const STORAGE_KEY = 'operation_levi_v1';
        let items = [];
        let goals = [];
        let libraries = { skills: [], templates: [], preferences: [], context: [] };
        let teams = { ACST: [], DVLMNT: [], Personal: [] };
        let dailyHistory = [];
        let xpData = { total: 0, streak: 0, lastDate: '', achievements: [] };
        let currentFilter = '';
        let currentAssignee = '';
        let boardPersonFilter = '';
        let weekPersonFilter = '';
        let currentView = 'dashboard';
        let selectedItemId = null;
        let autoSaveTimer = null;

        // ── Supabase auth state ───────────────────────────────────────────────────
        let _sb = null;           // Supabase client (initialised in initAuth)
        let _currentUser = null;  // auth.User object
        let _workspaceId = null;  // UUID of the workspace this user belongs to
        let _userRole    = 'member'; // 'admin' | 'member'
        let _userName    = '';    // display name (matches task assignees)
        let _userCategory = null;  // workspace/category scope for non-admins (null/'All' = every category)
        let _userVisibility = 'all'; // 'all' = see all tasks in their category | 'assigned' = only tasks assigned to them
        let _memberFullItems = null; // non-admin backstop: full item list pre-filter
        let _cloudSaveTimer  = null;
        let ganttWeeks = 13;
        let ganttExpanded = {};
        let peopleProfiles = {};
        let draggedGoalId = null;
        let myDayOffset = 0;   // 0 = today, -1 = yesterday, +1 = tomorrow
        let myWeekOffset = 0;  // 0 = current week, -1 = last week, etc.
        let weekHistory = [];  // Store weekly snapshots
        let weatherCache = {};
        let ganttFilterType = 'all'; // 'all', 'project', 'task'
        let ganttFilterCategory = 'all';
        let ganttFilterPerson = 'all';
        let top3Manual = [];
        let widgetLayouts = {};
        let events = [];
        let currentTimelineTab = 'gantt';
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                let parsed;
                try {
                    parsed = JSON.parse(saved);
                } catch(e) {
                    console.error('Data parse error — starting fresh. Raw data backed up to console.', e);
                    console.log('RAW DATA:', saved.substring(0, 500));
                    // Back up corrupted data then start fresh
                    localStorage.setItem(STORAGE_KEY + '_corrupted_backup', saved);
                    items = getInitialData();
                    goals = getSeedGoals();
                    teams = { ACST: ['Levi','Chad','Darci','JB'], DVLMNT: ['Levi','Nic','Zoe','Jason'], Personal: ['Levi'] };
                    return; // XP/day-archive retired with classic
                }
                const rawItems = Array.isArray(parsed) ? parsed : (parsed.items || []);
                goals = Array.isArray(parsed) ? [] : (parsed.goals || []).map(g => ({
                    ...g,
                    forecastDate: g.forecastDate || g.targetDate || '',
                    expectedDate: g.expectedDate || g.targetDate || '',
                    conservativeDate: g.conservativeDate || g.targetDate || '',
                    bestCaseDate: g.bestCaseDate || g.targetDate || '',
                    updates: g.updates || []
                }));
                teams = Array.isArray(parsed) ? { ACST: [], DVLMNT: [], Personal: [] } : (parsed.teams || { ACST: [], DVLMNT: [], Personal: [] });
                dailyHistory = Array.isArray(parsed) ? [] : (parsed.dailyHistory || []);
                weekHistory = Array.isArray(parsed) ? [] : (parsed.weekHistory || []);
                const rawProfiles = Array.isArray(parsed) ? {} : (parsed.peopleProfiles || {});
                peopleProfiles = {};
                Object.entries(rawProfiles).forEach(([person, profile]) => {
                    peopleProfiles[person] = {
                        role: profile.role || '',
                        email: profile.email || '',
                        hoursPerWeek: profile.hoursPerWeek || 40, capacityCadence: profile.capacityCadence || 'weekly', rate: profile.rate || 0, isEA: profile.isEA || false,
                        resources: profile.resources || [],
                        profileNotes: profile.profileNotes || '',
                        meetingNotes: profile.meetingNotes || [],
                        trackCapacity: profile.trackCapacity !== undefined ? profile.trackCapacity : (person === 'Levi' ? true : false)
                    };
                });
                top3Manual = Array.isArray(parsed) ? [] : (parsed.top3Manual || []);
                widgetLayouts = Array.isArray(parsed) ? {} : (parsed.widgetLayouts || {});
                events = Array.isArray(parsed) ? [] : (parsed.events || []);
                libraries = Array.isArray(parsed) ? { skills: [], templates: [], preferences: [], context: [] } : Object.assign({ skills: [], templates: [], preferences: [], context: [] }, parsed.libraries || {});
                
                // Sync cloud avatars into localStorage so getAvatarHTML picks them up immediately
            const cloudAvatars = JSON.parse(localStorage.getItem('op_levi_avatars') || '{}');
            Object.entries(peopleProfiles).forEach(([person, profile]) => {
                if (profile.avatar && !cloudAvatars[person]) cloudAvatars[person] = profile.avatar;
            });
            localStorage.setItem('op_levi_avatars', JSON.stringify(cloudAvatars));

            items = rawItems.map(item => ({
                    id: item.id || Math.random().toString(36).substr(2, 9),
                    type: item.type || 'task',
                    title: item.title || '',
                    category: item.category || 'Personal',
                    status: (item.status === 'someday' ? 'backlog' : item.status) || 'backlog',
                    execMode: item.execMode || null,
                    aiStatus: item.aiStatus || 'idle',
                    aiArtifact: item.aiArtifact || null,
                    aiUsed: item.aiUsed || null,
                    linkedContext: item.linkedContext || [],
                    comments: item.comments || [],
                    requireProof: item.requireProof || false,
                    proof: item.proof || null,
                    pinned: item.pinned || false,
                    aiConfidence: item.aiConfidence != null ? item.aiConfidence : null,
                    aiAssess: item.aiAssess || null,
                    _timerStart: item._timerStart || null,
                    availableForEA: item.availableForEA || false,
                    submittedBy: item.submittedBy || '',
                    startDate: item.startDate || '',
                    dueDate: item.dueDate || '',
                    deliverable: item.deliverable || '',
                    notes: item.notes || '',
                    priority: item.priority || 0,
                    timeEstimate: item.timeEstimate || 0,
                    tshirtSize: item.tshirtSize || 'XS',
                    raci: item.raci || { R: [], A: '', C: [], I: [] },
                    assignees: item.assignees || [],
                    responsible: item.responsible || '',
                    responsible2: item.responsible2 || (item.raci?.R || [])[0] || '',
                    informed: item.informed || [],
                    involved: item.involved || item.raci?.C || [],
                    approver: item.approver || item.raci?.A || '',
                    informedWhenComplete: item.informedWhenComplete || item.raci?.I || [],
                    waitingOn: item.waitingOn || '',
                    waitingFrom: item.waitingFrom || '',
                    waitingExpected: item.waitingExpected || '',
                    goalIds: item.goalIds || [],
                    approvers: item.approvers || [],
                    meetings: item.meetings || [],
                    subtasks: (item.subtasks || []).map(s => ({ ...s, weight: s.weight || 1 })),
                    timeline: item.timeline || [],
                    urls: item.urls || [],
                    documents: item.documents || [],
                    habitCompletions: item.habitCompletions || [],
                    recurring: item.recurring || false,
                    recurringFrequency: item.recurringFrequency || '',
                    columnEnteredAt: item.columnEnteredAt || Date.now(),
                    order: item.order !== undefined ? item.order : 999,
                    notionUrl: item.notionUrl || '',
                    figmaUrl: item.figmaUrl || '',
                    googleDocsUrl: item.googleDocsUrl || '',
                    msDocsUrl: item.msDocsUrl || '',
                    msExcelUrl: item.msExcelUrl || '',
                    questions: item.questions || [],
                    parentItemId: item.parentItemId || '',
                    recurrence: item.recurrence || null,
                    blockedBy: item.blockedBy || [],
                    timeLog: item.timeLog || [],
                    scheduledTime: item.scheduledTime || '',
                    templateId: item.templateId || '',
                    completedAt: item.completedAt || '',
                }));
            } else {
                items = getInitialData();
                goals = getSeedGoals();
                teams = { ACST: ['Levi','Chad','Darci','JB'], DVLMNT: ['Levi','Nic','Zoe','Jason'], Personal: ['Levi'] };
            }

            // Ensure habits exist
            const existingHabits = items.filter(i => i.type === 'habit');
            if (existingHabits.length === 0) {
                const now = Date.now();
                const habitDefaults = { startDate: '', dueDate: '', deliverable: '', notionUrl: '', figmaUrl: '', googleDocsUrl: '', msDocsUrl: '', msExcelUrl: '', waitingOn: '', waitingFrom: '', goalIds: [], approvers: [], meetings: [], subtasks: [], timeline: [], urls: [], documents: [], columnEnteredAt: now, order: 999, priority: 0, timeEstimate: 0, tshirtSize: 'XS', raci: { R: ['Levi'], A: 'Levi', C: [], I: [] }, responsible: 'Levi', informed: [] };
                items.push({ id: 'h1', type: 'habit', title: 'Daily Workout', category: 'Personal', status: 'active', assignees: ['Levi'], habitCompletions: [], recurring: true, recurringFrequency: 'daily', ...habitDefaults });
                items.push({ id: 'h2', type: 'habit', title: 'Daily Supplements', category: 'Personal', status: 'active', assignees: ['Levi'], habitCompletions: [], recurring: true, recurringFrequency: 'daily', ...habitDefaults });
                items.push({ id: 'h3', type: 'habit', title: '3L Water', category: 'Personal', status: 'active', assignees: ['Levi'], habitCompletions: [], recurring: true, recurringFrequency: 'daily', ...habitDefaults });
                items.push({ id: 'h4', type: 'habit', title: 'Reply to All Messages', category: 'ACST', status: 'active', assignees: ['Levi'], habitCompletions: [], recurring: true, recurringFrequency: 'daily', ...habitDefaults });
                items.push({ id: 'h5', type: 'habit', title: 'Update Active Projects', category: 'DVLMNT', status: 'active', assignees: ['Levi'], habitCompletions: [], recurring: true, recurringFrequency: 'daily', ...habitDefaults });
                if (!saved) { saveData(); }
            }

        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, goals, teams, dailyHistory, weekHistory, peopleProfiles, top3Manual, widgetLayouts, events, libraries }));
            _queueCloudSave();
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // SUPABASE AUTH & CLOUD SYNC
        // ═══════════════════════════════════════════════════════════════════════════

        /** Initialise Supabase client and check existing session */
        async function initAuth() {
            // Guard: SDK must be loaded
            if (typeof window.supabase === 'undefined') {
                console.warn('[Auth] Supabase SDK not loaded — running in local-only mode');
                document.getElementById('authOverlay').style.display = 'none';
                return;
            }
            if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                console.warn('[Auth] Supabase not configured — running in local-only mode');
                document.getElementById('authOverlay').style.display = 'none';
                return;
            }

            _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Check for existing session
            const { data: { session } } = await _sb.auth.getSession();
            window._lpToken = session?.access_token || '';
            if (session?.user) {
                _currentUser = session.user;
                await _loadWorkspaceMembership();
            } else {
                _showAuthOverlay();
            }

            // React to future sign-in / sign-out events (TOKEN_REFRESHED keeps _lpToken fresh for /api/* calls)
            _sb.auth.onAuthStateChange(async (event, session) => {
                window._lpToken = session?.access_token || '';
                if (event === 'SIGNED_IN' && session?.user) {
                    _currentUser = session.user;
                    _hideAuthOverlay();
                    await _loadWorkspaceMembership();
                } else if (event === 'SIGNED_OUT') {
                    _currentUser = null;
                    _workspaceId = null;
                    _memberFullItems = null;
                    _showAuthOverlay();
                    _updateUserDisplay();
                }
            });
            // Shared headers for all /api/* calls — the server now requires this token.
            window.lpApiHeaders = function(){ return { 'content-type':'application/json', 'authorization':'Bearer ' + (window._lpToken || '') }; };
        }

        /** Load the user's workspace membership and then pull cloud data */
        async function _loadWorkspaceMembership() {
            const { data: member, error } = await _sb
                .from('workspace_members')
                .select('workspace_id, role, name, category, visibility')
                .eq('user_id', _currentUser.id)
                .single();

            if (error || !member) {
                const errEl = document.getElementById('authError');
                if (errEl) errEl.textContent = 'No workspace found for this account. Contact your admin.';
                _showAuthOverlay();
                return;
            }

            _workspaceId    = member.workspace_id;
            _userRole       = member.role;
            _userName       = member.name;
            _userCategory   = member.category || null;
            _userVisibility = member.visibility || 'all';

            await _syncFromCloud();
            _hideAuthOverlay();
            _updateUserDisplay();
        }

        /** Pull the workspace JSON blob from Supabase and refresh app state */
        async function _syncFromCloud() {
            if (!_workspaceId || !_sb) return;

            // ── Non-admin members: read ONLY their permitted rows from the RLS-protected `tasks`
            //    table. The database (not the browser) decides what they can see, based on their
            //    category + visibility. Members never receive the full workspace blob. ──
            if (_userRole !== 'admin') {
                const { data: rows, error: tErr } = await _sb
                    .from('tasks')
                    .select('card')
                    .eq('workspace_id', _workspaceId);
                if (tErr) {
                    const errEl = document.getElementById('authError');
                    if (errEl) errEl.textContent = 'Could not load your tasks. Contact your admin.';
                    return;
                }
                items = (rows || []).map(r => Object.assign(
                    { assignees: [], subtasks: [], raci: { R: [], A: '', C: [], I: [] }, status: 'backlog' },
                    r.card || {}
                ));
                // Seed change-tracking so member pushes also upsert only what changed.
                window._lpKnownTaskIds = new Set(items.map(it => String(it.id)));
                window._lpTaskSnapshots = {};
                items.forEach(it => { window._lpTaskSnapshots[String(it.id)] = JSON.stringify(it); });
                window._lpRowsLoaded = true;
                // Members get a focused, task-only view; workspace-wide collections stay empty.
                goals = []; teams = { ACST: [], DVLMNT: [], Personal: [] };
                dailyHistory = []; weekHistory = []; top3Manual = [];
                widgetLayouts = {}; events = [];
                libraries = { skills: [], templates: [], preferences: [], context: [] };
                peopleProfiles = {};
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, goals, teams, dailyHistory, weekHistory, peopleProfiles, top3Manual, widgetLayouts, events, libraries }));
                showToast('✦ Synced from cloud');
                return;
            }

            const { data, error } = await _sb
                .from('workspace_data')
                .select('data')
                .eq('workspace_id', _workspaceId)
                .single();

            if (error || !data?.data) {
                // No cloud record yet — if admin, push local data up to bootstrap
                if (_userRole === 'admin') {
                    await _pushToCloud();
                    showToast('✦ Workspace created — data synced to cloud');
                }
                return;
            }

            // Apply cloud data to app state (same logic as loadData)
            const parsed = data.data;
            const rawItems = Array.isArray(parsed) ? parsed : (parsed.items || []);
            goals         = Array.isArray(parsed) ? [] : (parsed.goals || []).map(g => ({
                ...g,
                forecastDate:     g.forecastDate     || g.targetDate || '',
                expectedDate:     g.expectedDate     || g.targetDate || '',
                conservativeDate: g.conservativeDate || g.targetDate || '',
                bestCaseDate:     g.bestCaseDate     || g.targetDate || '',
                updates: g.updates || []
            }));
            teams         = Array.isArray(parsed) ? { ACST: [], DVLMNT: [], Personal: [] } : (parsed.teams         || { ACST: [], DVLMNT: [], Personal: [] });
            dailyHistory  = Array.isArray(parsed) ? [] : (parsed.dailyHistory  || []);
            weekHistory   = Array.isArray(parsed) ? [] : (parsed.weekHistory   || []);
            top3Manual    = Array.isArray(parsed) ? [] : (parsed.top3Manual    || []);
            widgetLayouts = Array.isArray(parsed) ? {} : (parsed.widgetLayouts || {});
            events        = Array.isArray(parsed) ? [] : (parsed.events        || []);
            libraries     = Array.isArray(parsed) ? { skills: [], templates: [], preferences: [], context: [] } : Object.assign({ skills: [], templates: [], preferences: [], context: [] }, parsed.libraries || {});
            const rawProfiles = Array.isArray(parsed) ? {} : (parsed.peopleProfiles || {});
            peopleProfiles = {};
            Object.entries(rawProfiles).forEach(([person, profile]) => {

                };
            });

            items = rawItems.map(item => ({
                id: item.id || Math.random().toString(36).substr(2, 9),
                type: item.type || 'task', title: item.title || '', category: item.category || 'Personal',
                status: (item.status === 'someday' ? 'backlog' : item.status) || 'backlog',
                    execMode: item.execMode || null,
                    aiStatus: item.aiStatus || 'idle',
                    aiArtifact: item.aiArtifact || null,
                    aiUsed: item.aiUsed || null,
                    linkedContext: item.linkedContext || [],
                    comments: item.comments || [],
                    requireProof: item.requireProof || false,
                    proof: item.proof || null,
                    pinned: item.pinned || false,
                    aiConfidence: item.aiConfidence != null ? item.aiConfidence : null,
                    aiAssess: item.aiAssess || null,
                    _timerStart: item._timerStart || null,
                    availableForEA: item.availableForEA || false,
                    submittedBy: item.submittedBy || '',
                startDate: item.startDate || '', dueDate: item.dueDate || '', deliverable: item.deliverable || '',
                notes: item.notes || '', priority: item.priority || 0, timeEstimate: item.timeEstimate || 0,
                tshirtSize: item.tshirtSize || 'XS', raci: item.raci || { R: [], A: '', C: [], I: [] },
                assignees: item.assignees || [], responsible: item.responsible || '',
                responsible2: item.responsible2 || '', informed: item.informed || [],
                involved: item.involved || [], approver: item.approver || '',
                informedWhenComplete: item.informedWhenComplete || [], waitingOn: item.waitingOn || '',
                waitingFrom: item.waitingFrom || '', waitingExpected: item.waitingExpected || '',
                goalIds: item.goalIds || [], approvers: item.approvers || [], meetings: item.meetings || [],
                subtasks: (item.subtasks || []).map(s => ({ ...s, weight: s.weight || 1 })),
                timeline: item.timeline || [], urls: item.urls || [], documents: item.documents || [],
                habitCompletions: item.habitCompletions || [], recurring: item.recurring || false,
                recurringFrequency: item.recurringFrequency || '', columnEnteredAt: item.columnEnteredAt || Date.now(),
                order: item.order !== undefined ? item.order : 999, notionUrl: item.notionUrl || '',
                figmaUrl: item.figmaUrl || '', googleDocsUrl: item.googleDocsUrl || '',
                msDocsUrl: item.msDocsUrl || '', msExcelUrl: item.msExcelUrl || '',
                questions: item.questions || [], parentItemId: item.parentItemId || '',
                recurrence: item.recurrence || null, blockedBy: item.blockedBy || [],
                timeLog: item.timeLog || [], scheduledTime: item.scheduledTime || '',
                templateId: item.templateId || '', completedAt: item.completedAt || '',
            }));

            // ── Foundation: the per-row `tasks` table is the source of truth for tasks. ──
            // Rows win over the blob copy (every write path dual-writes rows, so rows are
            // always at least as fresh — this ends whole-blob last-write-wins for tasks and
            // the old prune-from-stale-state data-loss hazard).
            try {
                const { data: rowData, error: rowErr } = await _sb
                    .from('tasks').select('id, card, updated_at').eq('workspace_id', _workspaceId);
                window._lpKnownTaskIds = new Set();
                window._lpTaskSnapshots = {};
                if (!rowErr && rowData) {
                    const rowMap = new Map(rowData.map(r => [String(r.id), r]));
                    // Replace blob copies with their authoritative row versions.
                    items = items.map(it => {
                        const r = rowMap.get(String(it.id));
                        return r && r.card ? Object.assign({}, it, r.card) : it;
                    });
                    // Tasks that exist only as rows (created by a member / another device).
                    const haveIds = new Set(items.map(it => String(it.id)));
                    rowData.forEach(r => {
                        if (!haveIds.has(String(r.id)) && r.card) items.push(r.card);
                    });
                    rowData.forEach(r => { window._lpKnownTaskIds.add(String(r.id)); });
                    // Only snapshot tasks that actually HAVE a row. Snapshotting a row-less
                    // task makes the bootstrap push below see it as unchanged, so it never
                    // gets a row — and once that happens the server can never see it again,
                    // however many times it is edited. That is how a task could sit in the
                    // app's review queue while the morning brief had no idea it existed.
                    items.forEach(it => {
                        const _k = String(it.id);
                        if (window._lpKnownTaskIds.has(_k)) window._lpTaskSnapshots[_k] = JSON.stringify(it);
                        else delete window._lpTaskSnapshots[_k];
                    });
                    window._lpRowsLoaded = true;
                } else {
                    window._lpRowsLoaded = false; // rows unavailable — never prune on this session
                    console.warn('[tasks sync] row load failed:', rowErr && rowErr.message);
                }
            } catch (e) { window._lpRowsLoaded = false; console.warn('[tasks sync] row load threw:', e.message); }

            // Mirror only blob-only tasks that had no row yet (bootstrap), instead of
            // re-stamping every row's updated_at on every load.
            _syncTasksTable(items.filter(it => !window._lpKnownTaskIds || !window._lpKnownTaskIds.has(String(it.id))));

            // Mirror to localStorage so the app works offline after first load
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, goals, teams, dailyHistory, weekHistory, peopleProfiles, top3Manual, widgetLayouts, events, libraries }));

            showToast('✦ Synced from cloud');
        }

        /** Mirror the in-memory items into the per-row `tasks` table (RLS-enforced source for members).
         *  Admins push the whole set and prune deleted rows; members upsert only what they can write. */
        async function _syncTasksTable(itemList, opts = {}) {
            if (!_workspaceId || !_sb) return;
            try {
                if (!window._lpTaskSnapshots) window._lpTaskSnapshots = {};
                if (!window._lpKnownTaskIds) window._lpKnownTaskIds = new Set();
                // Foundation: upsert ONLY tasks that actually changed since load / last push.
                // Unchanged tasks keep their row's updated_at, so a stale device can no longer
                // overwrite a fresher row with an identical-looking old copy en masse.
                const changed = (itemList || []).filter(it => {
                    if (!it || it.id == null) return false;
                    const key = String(it.id);
                    return window._lpTaskSnapshots[key] !== JSON.stringify(it);
                });
                const rows = changed.map(it => ({
                    id: String(it.id),
                    workspace_id: _workspaceId,
                    category: it.category || null,
                    assignees: it.assignees || [],
                    status: it.status || null,
                    title: it.title || '',
                    card: it,
                    updated_at: new Date().toISOString()
                }));
                if (rows.length) {
                    const { error } = await _sb.from('tasks').upsert(rows, { onConflict: 'id' });
                    if (error) { console.warn('[tasks sync] upsert failed:', error.message); return; }
                    changed.forEach(it => {
                        const key = String(it.id);
                        window._lpTaskSnapshots[key] = JSON.stringify(it);
                        window._lpKnownTaskIds.add(key);
                    });
                }
                // Safe prune: only remove rows this session actually LOADED and the user then
                // deleted locally — never rows it has not seen (another device's new tasks),
                // and never when the initial row load failed.
                if (_userRole === 'admin' && !opts.membersOnly && window._lpRowsLoaded) {
                    const current = new Set((items || []).filter(it => it && it.id != null).map(it => String(it.id)));
                    const remove = [...window._lpKnownTaskIds].filter(id => !current.has(id));
                    if (remove.length) {
                        const { error: delErr } = await _sb.from('tasks').delete().in('id', remove);
                        if (!delErr) remove.forEach(id => { window._lpKnownTaskIds.delete(id); delete window._lpTaskSnapshots[id]; });
                    }
                }
            } catch (e) {
                console.warn('[tasks sync]', e.message);
            }
        }

        /** Push current app state to Supabase (debounced by _queueCloudSave) */
        async function _pushToCloud() {
            if (!_workspaceId || !_sb) return;

            // Members no longer hold (or can read) the full blob — they write their permitted
            // items straight back to the RLS-protected `tasks` table.
            if (_userRole !== 'admin') {
                await _syncTasksTable(items, { membersOnly: true });
                return;
            }

            // Admin: rows first (tasks source of truth), then the blob for everything else.
            await _syncTasksTable(items);
            const { error } = await _sb.from('workspace_data').upsert({
                workspace_id: _workspaceId,
                data: { items, goals, teams, dailyHistory, weekHistory, peopleProfiles, top3Manual, widgetLayouts, events, libraries },
                updated_at: new Date().toISOString()
            }, { onConflict: 'workspace_id' });
            if (error) console.warn('[Supabase] save failed:', error.message);
        }

        /** Debounce cloud saves — waits 2 s after last saveData() call */
        function _queueCloudSave() {
            if (!_workspaceId || !_sb) return;
            clearTimeout(_cloudSaveTimer);
            _cloudSaveTimer = setTimeout(() => _pushToCloud(), 2000);
        }

        /** Create a new workspace member (admin only) */
        async function _createMember() {
            const name  = (document.getElementById('newMemberName').value  || '').trim();
            const email = (document.getElementById('newMemberEmail').value || '').trim();
            const pwd   = (document.getElementById('newMemberPwd').value   || '').trim();
            const role       = document.getElementById('newMemberRole').value;
            const category   = document.getElementById('newMemberCategory').value || null;
            const visibility = document.getElementById('newMemberVisibility').value || 'all';
            const errEl = document.getElementById('addMemberError');
            if (!name || !email || !pwd) { errEl.textContent = 'All fields are required.'; return; }
            errEl.textContent = 'Creating account…';

            // Create the login + workspace membership server-side via the secure, admin-gated
            // edge function (service role). The browser never handles the service key, and the
            // member's category + visibility are saved with their membership.
            let payload = null, fnErr = null;
            try {
                const res = await _sb.functions.invoke('admin-create-user', {
                    body: { email, password: pwd, name, role, category, visibility, workspace_id: _workspaceId }
                });
                payload = res.data; fnErr = res.error;
                // surface the server's error message when the function returns a non-2xx status
                if (fnErr && fnErr.context && typeof fnErr.context.json === 'function') {
                    try { const j = await fnErr.context.json(); if (j && j.error) fnErr = { message: j.error }; } catch (e) {}
                }
            } catch (e) { fnErr = { message: e.message }; }
            if (fnErr || (payload && payload.error)) {
                errEl.textContent = (payload && payload.error) ? payload.error : (fnErr.message || 'Could not create member.');
                return;
            }

            document.getElementById('addMemberModal').remove();

            // Record their email on the People profile so assignment notifications can reach them.
            try {
                if (!peopleProfiles[name]) peopleProfiles[name] = {};
                if (!peopleProfiles[name].email) { peopleProfiles[name].email = email; saveData(); }
            } catch (e) {}

            // Foundation: email the new member a welcome invite (server-built template, Resend).
            const wantInvite = !!(document.getElementById('newMemberSendInvite')?.checked);
            if (wantInvite) {
                try {
                    const r = await fetch('/api/notify', { method: 'POST', headers: window.lpApiHeaders ? window.lpApiHeaders() : { 'content-type': 'application/json' },
                        body: JSON.stringify({ kind: 'welcome', to: email, person: name, invite: { email, tempPassword: pwd, invitedBy: _userName || 'Levi' } }) });
                    if (r.ok) showToast('✓ ' + name + ' added — invite emailed to ' + email);
                    else { const j = await r.json().catch(() => ({}));
                        showToast(j.error === 'no_from' ? ('✓ ' + name + ' added — email needs a verified sender; share their password: ' + pwd) : ('✓ ' + name + ' added — invite email failed; share their password: ' + pwd)); }
                } catch (e) { showToast('✓ ' + name + ' added — invite email failed; share their password: ' + pwd); }
            } else {
                showToast('✓ ' + name + ' added — share their password: ' + pwd);
            }
            _renderTeamList();
        }

        function getItemProgress(item) {
            const subs = (item.subtasks || []).filter(s => s.type !== 'question'); // questions don't count toward progress
            if (subs.length === 0) return { done: 0, total: 0, pct: 0 };
            const totalWeight = subs.reduce((s, st) => s + (st.weight || 1), 0);
            const doneWeight = subs.filter(s => s.done).reduce((s, st) => s + (st.weight || 1), 0);
            return { done: subs.filter(s => s.done).length, total: subs.length, pct: totalWeight > 0 ? Math.round(doneWeight / totalWeight * 100) : 0 };
        }

        async function lpAssist(prompt, maxTokens) {
            const res = await fetch('/api/assist', { method:'POST',

                body: JSON.stringify({ prompt: prompt, max_tokens: maxTokens || 500 }) });

            return data.text || '';

        async function uploadDocuments() {
            const it = items.find(i => i.id === selectedItemId);
            if (!it) return;
            if (!it.documents) it.documents = [];
            const input = document.getElementById('docUploadInput');
            const files = Array.from(input.files || []);
            const cloud = !!(_sb && _workspaceId); // Foundation: real files go to Supabase Storage
            const MAX_FILE_SIZE = (cloud ? 20 : 2) * 1024 * 1024;
            for (const file of files) {
                if (file.size > MAX_FILE_SIZE) { showToast('⚠️ "' + file.name + '" is too large (max ' + (cloud ? 20 : 2) + ' MB)'); continue; }
                if (cloud) {
                    const safe = file.name.replace(/[^\w.\-]+/g, '_');
                    const path = 'ws/' + _workspaceId + '/' + it.id + '/' + Date.now().toString(36) + '-' + safe;
                    const { error } = await _sb.storage.from('documents').upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
                    if (error) { showToast('⚠️ Upload failed for "' + file.name + '": ' + error.message); continue; }
                    it.documents.push({ name: file.name, size: file.size, type: file.type, storagePath: path, uploadedAt: new Date().toISOString() });
                    addTimelineEntry(it.id, 'Uploaded document: ' + file.name);
                } else {
                    // Offline/local-only fallback: keep legacy base64-in-blob behavior.
                    await new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            it.documents.push({ name: file.name, size: file.size, type: file.type, data: e.target.result, uploadedAt: new Date().toISOString() });
                            addTimelineEntry(it.id, 'Uploaded document: ' + file.name);
                            resolve();
                        };
                        reader.readAsDataURL(file);
                    });
                }
            }
            saveData();
            if (typeof openDetail === 'function') openDetail(selectedItemId); if (typeof window.lpRefreshDetail === 'function') window.lpRefreshDetail();
            input.value = '';
        }

/* review */
.ol2 .rev{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
/* ── Task detail: one screen, no page scroll ───────────────────────────────
   Levi: "I don't want to have to scroll down at all" and "my attention isn't
   drawn to what I need to do next". The frame is viewport-height; only the two
   inner panes scroll, and the next-step bar answers "what now" before anything
   else on the page. ─────────────────────────────────────────────────────── */
.ol2 #ol2Review.rvfull{display:flex;flex-direction:column;height:calc(100vh - 58px);min-height:0;overflow:hidden}
.ol2 .rvfull .hrow{margin-bottom:10px;flex-shrink:0}
.ol2 .rvfull .facts{flex-shrink:0;margin:0 0 12px}
.ol2 .rvbody{display:grid;grid-template-columns:360px 1fr;gap:16px;flex:1;min-height:0}
.ol2 .rvpane{min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px}
.ol2 .rvpane::-webkit-scrollbar{width:8px}
.ol2 .rvpane::-webkit-scrollbar-thumb{background:#2a2e36;border-radius:4px}
.ol2 .rvwork{display:flex;flex-direction:column;min-height:0;gap:10px}
.ol2 .rvwork .draft2{flex:1;min-height:0;max-height:none}
/* the answer to "what do I do next" */
.ol2 .nextbar{display:flex;align-items:center;gap:14px;background:#15161b;border:1px solid #2b2f37;border-left:3px solid #4F8AD1;border-radius:12px;padding:12px 15px;margin-bottom:12px;flex-shrink:0}
.ol2 .nextbar.wing{border-left-color:#C08428;background:rgba(192,132,40,.06)}
.ol2 .nextbar.late{border-left-color:#E08A8A;background:rgba(224,138,138,.05)}
.ol2 .nextbar.calm{border-left-color:#3FA276}
.ol2 .nextbar .nb{flex:1;min-width:0}
.ol2 .nextbar .nk{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:#6E717B;text-transform:uppercase}
.ol2 .nextbar.wing .nk{color:#C08428}
.ol2 .nextbar.late .nk{color:#E08A8A}
.ol2 .nextbar .nt{font-size:14.5px;font-weight:600;margin-top:3px;line-height:1.35}
.ol2 .nextbar .nw{font-size:12px;color:#8A8D97;margin-top:2px;line-height:1.45}
.ol2 .nextbar .na{display:flex;gap:8px;flex-shrink:0}
/* left-rail tabs keep links, files, time and activity one click away, never a scroll */
.ol2 .rvtabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap;flex-shrink:0}
.ol2 .rvtabs a{font-size:11.5px;font-weight:600;color:#8A8D97;padding:6px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.ol2 .rvtabs a:hover{color:#E9EAEE;background:#191B20}
.ol2 .rvtabs a.on{color:#E9EAEE;background:#1d2129;border-color:#30353d}
.ol2 .rvtabs a .n{font-family:'Space Mono',monospace;font-size:9.5px;color:#6E717B;margin-left:4px}
.ol2 .rvtab{display:none}
.ol2 .rvtab.on{display:block}
.ol2 .rvfull .lp-sec:first-child{margin-top:0;border-top:none;padding-top:0}
@media (max-width:900px){
  .ol2 #ol2Review.rvfull{height:auto;overflow:visible}
  .ol2 .rvbody{grid-template-columns:1fr}
  .ol2 .rvpane{overflow:visible;max-height:none}
  .ol2 .nextbar{flex-wrap:wrap}
  .ol2 .nextbar .na{width:100%}
  .ol2 .nextbar .na .gbtn{flex:1}
}

/* voice capture */
.ol2cap{position:fixed;inset:0;z-index:9200;background:rgba(4,4,6,.74);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding-top:10vh;font-family:'Inter',system-ui,sans-serif}
.ol2cap.on{display:flex}
.ol2cap *{box-sizing:border-box}
.ol2cap .cap{width:540px;max-width:92vw;background:#121317;border:1px solid #30353d;border-radius:18px;padding:28px 30px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5);color:#E9EAEE}
.ol2cap .mic{width:74px;height:74px;border-radius:50%;background:#C08428;margin:2px auto 14px;display:flex;align-items:center;justify-content:center;color:#1c1304;position:relative;cursor:pointer}
.ol2cap .mic svg{width:30px;height:30px}
.ol2cap .mic.live::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid #C08428;opacity:.5;animation:ol2pulse 1.3s ease-out infinite}
@keyframes ol2pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.35);opacity:0}}
.ol2cap h3{font-family:'Space Grotesk',sans-serif;text-align:center;font-size:18px;font-weight:700}
.ol2cap .sub{text-align:center;color:#8A8D97;font-size:12.5px;margin-top:4px}

.ol2cap .wave i{width:4px;border-radius:3px;background:#C08428;height:8px;animation:ol2w .9s ease-in-out infinite}
.ol2cap .wave i:nth-child(2n){animation-delay:.15s}.ol2cap .wave i:nth-child(3n){animation-delay:.3s}.ol2cap .wave i:nth-child(4n){animation-delay:.45s}
@keyframes ol2w{0%,100%{height:7px}50%{height:26px}}
.ol2cap textarea{width:100%;background:#0e0f13;border:1px solid #30353d;border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.5;min-height:58px;color:#E9EAEE;margin-top:4px;font-family:'Inter';resize:vertical}

.ein,.esel,.etxt{width:100%;box-sizing:border-box;background:#0E0F13;border:1px solid #2E323A;border-radius:10px;padding:11px 12px;color:#E9EAEE;font-size:14px;line-height:1.45;font-family:Inter,-apple-system,system-ui,sans-serif;min-height:42px;transition:border-color .12s,box-shadow .12s;-webkit-appearance:none;appearance:none}

.esel{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.75L6 6.25L11 1.75' stroke='%238A8D97' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:11px;padding-right:34px;cursor:pointer}

   so there is nothing left for these to collide with. */

<script>
(function(){
  if(window.__ol2) return; window.__ol2=true;
  function apiHeaders(){ return {'content-type':'application/json','authorization':'Bearer '+(window._lpToken||'')}; } // signed-in Supabase token — required by /api/*
  function ITEMS(){ try{ return (typeof items!=='undefined'&&items)?items:[]; }catch(e){ return []; } }
  function L(){ try{ return (typeof libraries!=='undefined'&&libraries)?libraries:{skills:[],templates:[],preferences:[],context:[]}; }catch(e){ return {skills:[],templates:[],preferences:[],context:[]}; } }
  function persist(){ try{ if(typeof saveData==='function') saveData(); }catch(e){} }
  function toast(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  function clickFab(id){ var f=document.getElementById(id); if(f) f.click(); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function initials(name){ name=String(name||'').trim(); if(!name) return '–'; var p=name.split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
  function owner(it){ if(it.assignees&&it.assignees.length) return it.assignees[0]; if(it.raci&&it.raci.A) return it.raci.A; if(it.responsible) return it.responsible; try{ return (typeof _userName!=='undefined'&&_userName)||'Levi'; }catch(e){ return 'Levi'; } }
  function dueLabel(d){ if(!d) return ''; try{ var dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; var now=new Date(); var t=new Date(now.getFullYear(),now.getMonth(),now.getDate()); var diff=Math.round((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())-t)/86400000); if(diff===0) return 'today'; if(diff===1) return 'tmrw'; if(diff===-1) return 'yest'; if(diff>1&&diff<7) return dt.toLocaleDateString(undefined,{weekday:'short'}); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return d; } }
  // library matching (mirrors the execution engine)
  function findByName(arr,name){ if(!name) return null; for(var i=0;i<(arr||[]).length;i++){ if(arr[i].name===name) return arr[i]; } return null; }
  // Relevance matching. The old version fell back to sk[0] when nothing scored, which is how
  // "Draft client proposal" ended up attached to a trip-booking task. An unrelated skill is
  // worse than none — it drags the whole draft off course — so below threshold we attach nothing.
  function lpWords(x){ return String(x||'').toLowerCase().match(/[a-z0-9]{4,}/g)||[]; }
  function lpSkillScore(s, cardText, cardWords, cardCat){
    var score=0;
    String(s.tags||'').toLowerCase().split(/[,\s]+/).filter(Boolean).forEach(function(tag){ if(tag.length>2 && cardText.indexOf(tag)>=0) score+=3; });
    lpWords(s.name).forEach(function(w){ if(cardWords.indexOf(w)>=0) score+=2; });
    lpWords(s.whenToUse||s.description||'').slice(0,40).forEach(function(w){ if(cardWords.indexOf(w)>=0) score+=1; });
    if(s.category && cardCat && s.category===cardCat && s.category!=='All') score+=1;
    return score;
  }
  function matchSkill(card){
    var sk=(L().skills||[]); if(!sk.length) return null;
    var t=((card.title||'')+' '+(card.notes||'')+' '+(card.deliverable||'')).toLowerCase();
    var tw=lpWords(t); var best=null,bs=0;
    sk.forEach(function(s){ var sc=lpSkillScore(s,t,tw,card.category); if(sc>bs){ bs=sc; best=s; } });
    return bs>=3 ? best : null;
  }
  function deriveContext(card,skill){ var ctx=(L().context||[]); if(skill&&skill.defaultContext){ var c=findByName(ctx,skill.defaultContext); if(c) return c; } var t=((card.title||'')+' '+(card.notes||'')).toLowerCase(); for(var i=0;i<ctx.length;i++){ var n=String(ctx[i].name||'').toLowerCase(); if(n.length>=3 && t.indexOf(n)>=0) return ctx[i]; } return null; }
  function derivePrefs(ctx){ return (L().preferences||[]).filter(function(p){ return (!p.scope||p.scope==='global'||p.scope==='category') || (ctx&&p.appliesTo&&p.appliesTo===ctx.name); }); }
  function assemble(card){ var skill=matchSkill(card); var tmpl=skill?findByName(L().templates||[],skill.linkedTemplate):null; var ctx=deriveContext(card,skill); var prefs=derivePrefs(ctx); return {skill:skill,tmpl:tmpl,ctx:ctx,prefs:prefs}; }
  var DELIV_TYPES=['','Email','Document','Deck','Spreadsheet','Research brief','Plan','Design / asset','Code','Message','Decision'];
  function inferDeliverable(low){
    if(/\b(email|reply|respond|follow[- ]?up)\b/.test(low)) return 'Email';
    if(/\b(deck|presentation|slides?)\b/.test(low)) return 'Deck';
    if(/\b(spreadsheet|sheet|budget|forecast|model)\b/.test(low)) return 'Spreadsheet';
    if(/\b(research|find|compare|look ?up|options?|listings?)\b/.test(low)) return 'Research brief';
    if(/\b(plan|roadmap|schedule|itinerary)\b/.test(low)) return 'Plan';
    if(/\b(design|logo|graphic|mockup|banner)\b/.test(low)) return 'Design / asset';
    if(/\b(code|script|fix|bug|deploy)\b/.test(low)) return 'Code';
    if(/\b(text|message|post|tweet|slack)\b/.test(low)) return 'Message';
    if(/\b(draft|write|summari[sz]e|recap|memo|doc|brief|outline|update)\b/.test(low)) return 'Document';
    return '';
  }
  function lpNotifyAssign(person, card){
    try{
      if(!person || person==='Wingman') return;
      var me=''; try{ me=(typeof _userName!=='undefined'&&_userName)||''; }catch(e){}
      if(person===me) return;
      var em=''; try{ em=(typeof peopleProfiles!=='undefined'&&peopleProfiles&&peopleProfiles[person]&&peopleProfiles[person].email)||''; }catch(e){}
      if(!em) return;
      fetch('/api/notify',{method:'POST',headers:apiHeaders(),body:JSON.stringify({kind:'assign',to:em,person:person,task:{title:card.title,due:card.dueDate,notes:card.notes,deliverable:card.deliverable}})})
        .then(function(r){ if(r.ok) toast('✉ '+person+' notified'); }).catch(function(){});
    }catch(e){}
  }
  function callRun(card, parts, instruction, prev, cb){
    var payload={card:card,skill:parts.skill,template:parts.tmpl,context:parts.ctx,preferences:parts.prefs};
    if(instruction){ payload.instruction=instruction; payload.previousDraft=prev||''; }
    fetch('/api/run',{method:'POST',headers:apiHeaders(),body:JSON.stringify(payload)})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
      .then(cb).catch(function(e){ cb({ok:false,status:0,j:{error:'fetch',detail:String(e&&e.message||e)}}); });
  }

  var COLS=[
    {label:'Backlog', color:'#8A8D97', st:['backlog','thisweek'], set:'thisweek'},
    {label:'In progress', color:'#4F8AD1', st:['priority','active','today','waiting'], set:'active'},
    {label:'Top 3', color:'#C08428', top3:true, st:[], set:'top3'},
    {label:'Needs review', color:'#C08428', st:['review'], set:'review'},
    {label:'Done', color:'#3FA276', st:['done'], set:'done'}
  ];

  // ===== Levi's Projects: helpers, weather, calendar, gantt, done =====
  var LP_WX_DEFAULT={name:'Sunriver, OR',lat:43.8735,lon:-121.4387};
  var boardView2='cols', calMonth=null, doneFilter='all';
  function meName(){ try{ return (typeof _userName!=='undefined'&&_userName)? _userName:'Levi'; }catch(e){ return 'Levi'; } }
  function lpCreatedTs(it){ if(it.createdAt) return it.createdAt; var id=String(it.id||''); if(id.charAt(0)==='v'&&id.length>=11){ var t=parseInt(id.slice(1,id.length-3),36); if(t>1.6e12&&t<2.1e12) return t; } return 0; }
  function lpUpdatedTs(it){ var t=it.columnEnteredAt||0; if(it.updatedAt&&it.updatedAt>t) t=it.updatedAt; try{ var tl=(it.timeline&&it.timeline.length)?(it.timeline[it.timeline.length-1].ts||0):0; if(tl>t) t=tl; }catch(e){} if(it.aiArtifact&&it.aiArtifact.createdAt>t) t=it.aiArtifact.createdAt; return t; }
  function lpShortD(ts){ if(!ts) return null; try{ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return null; } }
  // ── 5c: live chart builders — thin marks, Command palette, real workspace data ──
  function lpWeekBuckets(n){ var out=[]; var now=new Date(); now.setHours(0,0,0,0); var dow=(now.getDay()+6)%7; var start=new Date(now); start.setDate(now.getDate()-dow); for(var i=n-1;i>=0;i--){ var ws=new Date(start); ws.setDate(start.getDate()-i*7); var we=new Date(ws); we.setDate(ws.getDate()+7); out.push({s:ws.getTime(), e:we.getTime(), label:ws.toLocaleDateString(undefined,{month:'short',day:'numeric'})}); } return out; }
  function lpDoneTs2(i){ if(!i.completedAt) return 0; var d=new Date(String(i.completedAt).slice(0,10)+'T00:00:00').getTime(); return isNaN(d)?0:d; }
  function lpChartKeepingUp(){
    var wks=lpWeekBuckets(8); var its=ITEMS().filter(function(i){ return i.type!=='habit'; });
    var intake=wks.map(function(w){ return its.filter(function(i){ var t=lpCreatedTs(i); return t>=w.s&&t<w.e; }).length; });
    var done=wks.map(function(w){ return its.filter(function(i){ var d=lpDoneTs2(i); return d>=w.s&&d<w.e; }).length; });
    var W=460,H=176,x0=30,x1=W-54,yT=12,yB=H-24;
    var vmax=Math.max(4, Math.max.apply(null,intake.concat(done)));
    function X(i){ return x0+i*(x1-x0)/(wks.length-1); } function Y(v){ return yB-(v/vmax)*(yB-yT); }
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:520px" role="img" aria-label="New vs completed per week">';
    [0,Math.round(vmax/2),vmax].forEach(function(v){ s+='<line x1="'+x0+'" y1="'+Y(v)+'" x2="'+x1+'" y2="'+Y(v)+'" stroke="#26272D" stroke-width="1"/><text x="'+(x0-7)+'" y="'+(Y(v)+3)+'" text-anchor="end" style="font-size:9.5px" fill="#6E717B">'+v+'</text>'; });
    wks.forEach(function(w,i){ if(i%2===1) s+='<text x="'+X(i)+'" y="'+(H-7)+'" text-anchor="middle" style="font-size:9.5px" fill="#6E717B">'+w.label+'</text>'; });
    function line(vals,color){ var pts=vals.map(function(v,i){ return Math.round(X(i))+','+Math.round(Y(v)); }).join(' '); return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'; }
    s+=line(intake,'#4F8AD1')+line(done,'#3FA276');
    s+='<circle cx="'+X(7)+'" cy="'+Y(intake[7])+'" r="4" fill="#4F8AD1" stroke="#15161A" stroke-width="2"/><circle cx="'+X(7)+'" cy="'+Y(done[7])+'" r="4" fill="#3FA276" stroke="#15161A" stroke-width="2"/>';
    var close=Math.abs(Y(done[7])-Y(intake[7]))<12;
    s+='<text x="'+(X(7)+8)+'" y="'+(Y(intake[7])+3)+'" style="font-size:10px;font-weight:600" fill="#E9EAEE">'+intake[7]+' in</text>';
    s+='<text x="'+(X(7)+8)+'" y="'+(Y(done[7])+(close?14:3))+'" style="font-size:10px" fill="#9EA1AB">'+done[7]+' done</text>';
    return s+'</svg>';
  }
  function lpChartWorkload(){
    var today2=new Intl.DateTimeFormat('en-CA').format(new Date());
    var people=(typeof getAllAssignees==='function'?getAllAssignees():[]);
    var rows=people.map(function(p){ var its=lpPersonItems(p).filter(function(i){ return i.status!=='done'&&i.type!=='habit'; }); var od=its.filter(function(i){ return i.dueDate&&i.dueDate<today2; }).length; var act=its.filter(function(i){ return ['active','today','priority'].indexOf(i.status)>=0&&!(i.dueDate&&i.dueDate<today2); }).length; var q=Math.max(0,its.length-od-act); return {p:p,od:od,act:act,q:q,total:its.length}; }).filter(function(r){ return r.total>0; });
    rows.sort(function(a,b){ return b.total-a.total; });
    if(!rows.length) return '<div style="color:#6E717B;font-size:12px;padding:12px 0">No open work right now.</div>';
    var vmax=Math.max.apply(null,rows.map(function(r){ return r.total; }));
    var rowH=26, barH=13, x0=66, W=460, x1=W-46, H=rows.length*rowH+8;
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:520px" role="img" aria-label="Open work per person">';
    rows.forEach(function(r,i){ var y=4+i*rowH; s+='<text x="'+(x0-8)+'" y="'+(y+barH-3)+'" text-anchor="end" style="font-size:10.5px" fill="#9EA1AB">'+esc(r.p)+'</text>';
      var x=x0; [[r.od,'#E08A8A'],[r.act,'#4F8AD1'],[r.q,'#6E717B']].forEach(function(seg){ if(!seg[0]) return; var w2=Math.max(2, seg[0]/vmax*(x1-x0)-2); s+='<rect x="'+x+'" y="'+y+'" width="'+w2+'" height="'+barH+'" rx="2" fill="'+seg[1]+'"/>'; x+=w2+2; });
      s+='<text x="'+(x+7)+'" y="'+(y+barH-3)+'" style="font-size:10px'+(r.od>=3?';font-weight:700':'')+'" fill="'+(r.od>=3?'#E08A8A':'#6E717B')+'">'+r.total+(r.od>=3?' !':'')+'</text>'; });
    return s+'</svg>';
  }
  function lpChartWingman(){
    var wks=lpWeekBuckets(6); var its=ITEMS();
    var made=wks.map(function(w){ return its.filter(function(i){ return i.aiArtifact&&i.aiArtifact.createdAt>=w.s&&i.aiArtifact.createdAt<w.e; }).length; });
    var appr=wks.map(function(w){ return its.filter(function(i){ return i.aiArtifact&&i.aiArtifact.approvedAt&&i.aiArtifact.approvedAt>=w.s&&i.aiArtifact.approvedAt<w.e; }).length; });
    var W=460,H=168,x0=30,x1=W-16,yT=12,yB=H-24;
    var vmax=Math.max(3, Math.max.apply(null,made.concat(appr)));

      var list=ITEMS().filter(function(i){ return col.st.indexOf(i.status)>=0 && matchesFilter(i) && String(i.id)!==String(draggedId); });
      list.sort(function(a,b){ return (Number(a.order)||0)-(Number(b.order)||0); });
      var idx=-1; for(var j=0;j<list.length;j++){ if(String(list[j].id)===String(targetId)){ idx=j; break; } }

    // ── Calendar export: all-day trip block + a block per itinerary day ──
    function lpIcsEsc(t){ return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
    function lpIcsFold(line){ if(line.length<=73) return line; var out=[line.slice(0,73)], r=line.slice(73); while(r.length){ out.push(' '+r.slice(0,72)); r=r.slice(72); } return out.join('\r\n'); }
    function lpIcsDay(d,plus){ var dt=new Date(String(d)+'T00:00:00'); if(isNaN(dt)) return null; if(plus) dt.setDate(dt.getDate()+plus); return dt.getFullYear()+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0'); }
    function lpTripIcs(plan){
      var t=plan.trip||{}; var start=lpIcsDay(t.depart), end=lpIcsDay(t.ret||t.depart,1);
      if(!start){ toast('Add a departure date first'); return; }
      var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
      var body=[]; 
      (plan.toBook||[]).forEach(function(b){ body.push('• '+b.what+(b.details?(' — '+b.details):'')); });
      var L2=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Levis Projects//Wingman//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
      function ev(uid,ds,de,sum,desc,loc){
        L2.push('BEGIN:VEVENT'); L2.push('UID:'+uid); L2.push('DTSTAMP:'+stamp);
        L2.push('DTSTART;VALUE=DATE:'+ds); L2.push('DTEND;VALUE=DATE:'+de);
        L2.push(lpIcsFold('SUMMARY:'+lpIcsEsc(sum)));
        if(desc) L2.push(lpIcsFold('DESCRIPTION:'+lpIcsEsc(desc)));
        if(loc) L2.push(lpIcsFold('LOCATION:'+lpIcsEsc(loc)));
        L2.push('END:VEVENT');
      }
      var base='lptrip'+Date.now().toString(36);
      ev(base+'@levisprojects.com', start, end, 'Trip: '+(t.destination||'')+(t.purpose?(' — '+t.purpose):''),
         (plan.headline||'')+'\n\nTO BOOK\n'+(body.join('\n')||'—')+'\n\nPlanned by Wingman — fares and schedules to be confirmed at booking.', t.destination||'');
      (plan.itinerary||[]).forEach(function(d,i){
        var ds=null; try{ var m=String(d.day||'').match(/(\d{4}-\d{2}-\d{2})/); if(m) ds=lpIcsDay(m[1]); }catch(e){}
        if(!ds){ var off=new Date(String(t.depart)+'T00:00:00'); if(isNaN(off)) return; off.setDate(off.getDate()+i); ds=off.getFullYear()+String(off.getMonth()+1).padStart(2,'0')+String(off.getDate()).padStart(2,'0'); }
        var de=lpIcsDay(ds.slice(0,4)+'-'+ds.slice(4,6)+'-'+ds.slice(6,8),1);
        ev(base+'-d'+i+'@levisprojects.com', ds, de, (t.destination||'Trip')+' · '+(d.day||('Day '+(i+1))), (d.items||[]).map(function(x){ return '• '+x; }).join('\n'), t.destination||'');
      });
      L2.push('END:VCALENDAR');
      try{
        var blob=new Blob([L2.join('\r\n')],{type:'text/calendar;charset=utf-8'});
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download='trip-'+String(t.destination||'plan').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.ics';
        document.body.appendChild(a); a.click(); setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(e){} },1000);
        toast('Calendar file downloaded — open it to add the holds');
      }catch(e){ toast('Could not build the calendar file'); }
    }
    // ── The exact brief whoever books works from ──
    function lpTripBrief(plan){
      var t=plan.trip||{}; var tp=lpTravel(); var out=[];
      out.push('TRIP — '+(t.destination||'')+(t.purpose?(' · '+t.purpose):''));
      out.push((t.origin?('From '+t.origin+'  '):'')+(t.depart?('Depart '+t.depart):'')+(t.ret?('  Return '+t.ret):''));
      out.push('');
      if(plan.headline) out.push(plan.headline+'\n');
      (plan.flights||[]).forEach(function(f){
        out.push((f.leg||'Flight').toUpperCase());
        (f.options||[]).forEach(function(o,i){ out.push('  '+(i+1)+'. '+[o.airline,o.route,o.timing,o.fare].filter(Boolean).join(' · ')+(o.why?('\n     '+o.why):'')); });
        out.push('');
      });
      if((plan.lodging||[]).length){ out.push('LODGING'); plan.lodging.forEach(function(l){ out.push('  • '+[l.name,l.area,l.rate].filter(Boolean).join(' · ')+(l.why?('\n     '+l.why):'')); }); out.push(''); }
      if((plan.ground||[]).length){ out.push('GROUND'); plan.ground.forEach(function(g){ out.push('  • '+[g.mode,g.detail,g.cost].filter(Boolean).join(' · ')); }); out.push(''); }
      out.push('TO BOOK');
      (plan.toBook||[]).forEach(function(b){ out.push('  □ '+b.what+(b.details?(' — '+b.details):'')+(b.loyalty?('\n     Loyalty: '+b.loyalty):'')+('\n     Owner: '+(b.who==='EA'?'EA':'Levi'))); });
      out.push('');

      if(loy.length) out.push('LOYALTY ON FILE\n  '+loy.join('\n  ')+'\n');

    function lpRunPlay(play){
      var me=meName();
      var parent=newItemBase(play.name, play.category&&play.category!=='All'?play.category:(ITEMS()[0]&&ITEMS()[0].category)||'', '', '', me);
      parent.type='project'; parent.notes=play.description||'';
      var kids=[]; var nW=0;
      (play.steps||[]).forEach(function(sp){
        var ownerName=(sp.owner==='me'||sp.owner==='Wingman')?me:sp.owner;
        var kid=newItemBase(sp.title, parent.category, '', sp.deliverable||'', ownerName);
        kid.parentItemId=parent.id; kid.notes=sp.notes||'';
        if(sp.owner==='Wingman'){ kid.execMode='do-it'; nW++; }
        kids.push(kid);
      });
      try{ items.push(parent); kids.forEach(function(k){ items.push(k); }); }catch(e){}
      try{ persist(); }catch(e){}
      toast('▸ '+esc(play.name)+' running — '+kids.length+' steps'+(nW?(' · Wingman drafting '+nW):''));
      kids.forEach(function(k,i){
        if(k.execMode==='do-it'){ setTimeout(function(){ draftFor(k); }, i*400); }
        else if(k.responsible && k.responsible!==me){ lpNotifyAssign(k.responsible, k); }
      });
      go('board');
    }
    function lpPlayEdit(play){
      var Lo=L(); if(!Lo.plays) Lo.plays=[];
      var isNew=!play; play=play||{id:'play'+Date.now().toString(36),name:'',description:'',category:'All',steps:[]};
      var people=(typeof getAllAssignees==='function'?getAllAssignees():[]);
      var ownerOpts=[{v:'me',l:'You'},{v:'Wingman',l:'Wingman (AI)'}]
        .concat(people.filter(function(x){ return x!==meName() && x!=='Wingman'; }).map(function(x){ return {v:x,l:x}; }));
      var steps=(play.steps||[]).map(function(sp){ return {title:sp.title||'',owner:sp.owner||'me',deliverable:sp.deliverable||'',notes:sp.notes||''}; });
      if(!steps.length) steps.push({title:'',owner:'me',deliverable:'',notes:''});
      var delivOpts=DELIVS.map(function(d){ return {v:d,l:d||'No set output'}; });

      // Read whatever is on screen back into `steps` before any re-render, or

      function pull(ov){
        [].forEach.call(ov.querySelectorAll('[data-sf]'),function(el){

          +'<span class="sacts">'
          +'<button class="sbtn" data-mv="-1" data-i="'+i+'"'+(i===0?' disabled':'')+' title="Move up">↑</button>'
          +'<button class="sbtn" data-mv="1" data-i="'+i+'"'+(i===n-1?' disabled':'')+' title="Move down">↓</button>'
          +'<button class="sbtn del" data-del="'+i+'" title="Remove step">✕</button>'
          +'</span></div>'
          +lpRow(
            lpFld({label:'Owner',id:'sp_o_'+i,type:'select',value:sp.owner,opts:ownerOpts,attrs:' data-sf="owner" data-i="'+i+'"'}),
            lpFld({label:'Output',id:'sp_d_'+i,type:'select',value:sp.deliverable,opts:delivOpts,attrs:' data-sf="deliverable" data-i="'+i+'"'})
          )
          +lpFld({label:'How you want it done',id:'sp_n_'+i,type:'textarea',value:sp.notes,optional:true,rows:2,
                  ph:'Preferences, accounts, the details you would otherwise have to repeat every time',
                  attrs:' data-sf="notes" data-i="'+i+'"'})
          +'</div>';
      }
      function stepsHtml(){ return steps.map(function(sp,i){ return stepHtml(sp,i,steps.length); }).join('')
        +'<button class="gbtn lpaddstep" id="ppAdd">＋ Add step</button>'; }

      var body=lpFld({label:'Name',id:'ppName',value:play.name,ph:'e.g. Book travel',
                      hint:'What you would call this when you ask for it.'})
        +lpFld({label:'What this play does',id:'ppDesc',value:play.description||'',optional:true,
                ph:'e.g. Flights, rental car, ground transport and the itinerary email'})
        +lpSect('Steps','Each step gets an owner and an output. Wingman drafts the steps you give it; the rest become assigned tasks when you run the play.')
        +'<div id="ppSteps">'+stepsHtml()+'</div>';

      var footer=(isNew?'':'<button class="lpdanger" id="ppDel">Delete play</button>')
        +'<span class="sp"></span><button id="ppSave" class="gbtn amber">'+(isNew?'Create play':'Save play')+'</button>';

      var ov=lpModal({id:'lpPlayOv',wide:true,title:isNew?'New play':'Edit play',
        sub:'A play is a procedure you run the same way every time. Write it once, then hand the whole thing to Wingman or your EA.',
        body:body,footer:footer});
      lpOpen(ov);

      function bindSteps(){
        var host=ov.querySelector('#ppSteps'); if(!host) return;
        [].forEach.call(host.querySelectorAll('[data-del]'),function(b){ b.onclick=function(){
          pull(ov); steps.splice(+b.getAttribute('data-del'),1);
          if(!steps.length) steps.push({title:'',owner:'me',deliverable:'',notes:''});
          host.innerHTML=stepsHtml(); bindSteps();
        }; });
        [].forEach.call(host.querySelectorAll('[data-mv]'),function(b){ b.onclick=function(){
          pull(ov); var i=+b.getAttribute('data-i'), d=+b.getAttribute('data-mv'), j=i+d;
          if(j<0||j>=steps.length) return;
          var tmp=steps[i]; steps[i]=steps[j]; steps[j]=tmp;
          host.innerHTML=stepsHtml(); bindSteps();
        }; });
        var add=ov.querySelector('#ppAdd');
        if(add) add.onclick=function(){
          pull(ov); steps.push({title:'',owner:'me',deliverable:'',notes:''});
          host.innerHTML=stepsHtml(); bindSteps();
          var last=host.querySelectorAll('[data-sf="title"]'); if(last.length) try{ last[last.length-1].focus(); }catch(e){}
        };
      }
      bindSteps();

      var del=document.getElementById('ppDel');
      if(del) del.onclick=function(){
        if(!window.confirm('Delete the play "'+(play.name||'Untitled')+'"?')) return;
        var arr=Lo.plays; for(var i=arr.length-1;i>=0;i--){ if(arr[i].id===play.id) arr.splice(i,1); }
        try{ persist(); }catch(e){} ov.remove(); showPlays(); toast('Play deleted');
      };
      document.getElementById('ppSave').onclick=function(){
        pull(ov);
        play.name=(document.getElementById('ppName').value||'').trim();
        play.description=(document.getElementById('ppDesc').value||'').trim();
        if(!play.name){ toast('Name the play first'); try{ document.getElementById('ppName').focus(); }catch(e){} return; }
        play.steps=steps.filter(function(sp){ return (sp.title||'').trim(); });
        play.updatedAt=Date.now(); if(!play.createdAt) play.createdAt=Date.now();
        if(isNew) Lo.plays.push(play);
        try{ persist(); }catch(e){} ov.remove(); showPlays(); toast(isNew?'Play created':'Play saved');
      };
    }

    // Reorder the Top 3 by dragging — pins the displayed three in the new order.
    function reorderTop3(orderedIds, draggedId, targetId, before){
      if(String(draggedId)===String(targetId)) return;
      var ids=(orderedIds||[]).map(String).filter(function(x){ return x!==String(draggedId); });
      var idx=ids.indexOf(String(targetId)); if(idx<0) idx=ids.length; if(!before) idx=idx+1;

    // ── Goals (annual, fulfilled by the linked work beneath them) ──
    function lpGoalStats(goal){
      var linked=ITEMS().filter(function(i){ return (i.goalIds||[]).indexOf(goal.id)>=0; });
      var done=linked.filter(function(i){ return i.status==='done'; });
      var totalW=0,doneW=0;
      linked.forEach(function(i){ var p=null; try{ p=(typeof getItemProgress==='function')?getItemProgress(i):null; }catch(e){} var t=(p&&p.total)?p.total:1; totalW+=t; if(i.status==='done') doneW+=t; else if(p&&p.pct===100) doneW+=t; });
      var pct=totalW>0?Math.round(doneW/totalW*100):(linked.length?Math.round(done.length/linked.length*100):0);
      var today=new Date(); today.setHours(0,0,0,0);
      var overdue=linked.filter(function(i){ return i.dueDate && new Date(i.dueDate+'T00:00:00')<today && i.status!=='done'; });
      var open=linked.filter(function(i){ return i.status!=='done'; });
      var crit=open.slice().sort(function(a,b){ var ad=a.dueDate?+new Date(a.dueDate+'T00:00:00'):Infinity, bd=b.dueDate?+new Date(b.dueDate+'T00:00:00'):Infinity; return ad-bd; })[0]||null;
      var now=Date.now(),stalledDays=0,stalledItem=null;
      open.forEach(function(i){ if(i.columnEnteredAt){ var d=Math.floor((now-i.columnEnteredAt)/86400000); if(d>stalledDays){ stalledDays=d; stalledItem=i; } } });
      return {linked:linked,open:open,done:done,pct:pct,overdue:overdue,crit:crit,stalledDays:stalledDays,stalledItem:stalledItem};
    }
    function lpGoalYear(goal){ return goal.targetDate?new Date(goal.targetDate+'T00:00:00').getFullYear():new Date().getFullYear(); }
    function lpGoalQuarters(goal,linked){
      var yr=lpGoalYear(goal); var qc=[0,0,0,0],qd=[0,0,0,0];
      linked.forEach(function(i){ if(!i.dueDate) return; var d=new Date(i.dueDate+'T00:00:00'); if(d.getFullYear()!==yr) return; var q=Math.floor(d.getMonth()/3); qc[q]++; if(i.status==='done') qd[q]++; });
      return {year:yr,counts:qc,done:qd};
    }
    function lpGoalNarrative(s){
      if(!s.linked.length) return 'No work linked yet — link tasks so this goal can track itself.';
      if(s.pct>=100) return '✓ All linked work complete.';
      var parts=[s.done.length+' of '+s.linked.length+' tasks done'];
      if(s.overdue.length) parts.push(s.overdue.length+' overdue');
      if(s.crit) parts.push('critical path: “'+(s.crit.title||'a task')+'”'+(s.crit.dueDate?(' (due '+lpDueFull(s.crit.dueDate)+')'):''));
      if(s.stalledDays>=7&&s.stalledItem) parts.push('“'+(s.stalledItem.title||'a task')+'” hasn’t moved in '+s.stalledDays+'d');
      return parts.join(' · ');
    }
    function lpGoalAtRisk(goal,s){
      if(s.pct>=100) return false;
      if(s.overdue.length) return true;
      if(goal.targetDate){ var wk=(new Date(goal.targetDate+'T00:00:00')-new Date())/(7*86400000); if(wk>0&&wk<8&&s.pct<60) return true; }
      return false;
    }
    // The goal card says "link tasks so this goal can track itself". This is how you
    // actually do it — previously there was no control anywhere for it, so the
    // instruction was unfollowable and every goal sat at 0% forever.
    function lpGoalLink(goal){
      var all=ITEMS().filter(function(i){ return i.type!=='habit'; });
      var linkedIds={}; all.forEach(function(i){ if((i.goalIds||[]).indexOf(goal.id)>=0) linkedIds[String(i.id)]=1; });
      var open=all.filter(function(i){ return i.status!=='done'; });
      var done=all.filter(function(i){ return i.status==='done'; });
      var q='', showDone=false;
      function rows(){
        // Completed work has to be linkable, or a goal set up after the fact can never
        // leave 0% — which is the whole reason this control exists. Hidden by default
        // only because there is far more finished work than open work.
        var list=open.concat(showDone?done:done.filter(function(i){ return linkedIds[String(i.id)]; }));
        var f=list.filter(function(i){ return !q || (i.title||'').toLowerCase().indexOf(q.toLowerCase())>=0; });
        if(!f.length) return '<div class="memempty">Nothing matches.</div>';
        return f.map(function(i){

          return '<label class="lpck" style="margin-bottom:6px"><input type="checkbox" data-lk="'+esc(i.id)+'"'+(on?' checked':'')+'/>'

            +'<span class="cd">'+esc(i.category||'—')+' · '+esc(i.status==='done'?'done':(i.dueDate?('due '+lpDueFull(i.dueDate)):i.status))
            +(owner(i)?(' · '+esc(owner(i))):'')+'</span></span></label>';
        }).join('');

        +lpCheck('glDone','Include work already finished','Link past wins so a goal you set up today reflects what is already done.',false)
        +'<div id="glList" style="max-height:40vh;overflow-y:auto;padding-right:4px">'+rows()+'</div>';
      var ov=lpModal({title:'Link work to “'+(goal.title||'goal')+'”',
        sub:'A goal moves only when the work under it moves. Nothing linked means it can never leave 0%.',
        body:body,
        footer:'<span class="note" id="glN"></span><button id="glSave" class="gbtn amber">Save links</button>'});
      lpOpen(ov);
      function tally(){
        var n=Object.keys(linkedIds).length;

        // Walk every task, not just the visible rows, so filtering or hiding completed
        // work never silently unlinks something you could not see.
        all.forEach(function(i){
          var ids=(i.goalIds||[]).filter(function(x){ return String(x)!==String(goal.id); });
          if(linkedIds[String(i.id)]) ids.push(goal.id);
          i.goalIds=ids;

      };

    function mdLite(md){
      var t=esc(String(md||''));
      t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
      return t.split(/\n\n+/).map(function(block){
        var lines=block.split('\n');
        if(lines.every(function(l){ return /^\s*-\s+/.test(l); })){
          return '<ul class="doc-ul">'+lines.map(function(l){ return '<li>'+l.replace(/^\s*-\s+/,'')+'</li>'; }).join('')+'</ul>';
        }
        if(lines.every(function(l){ return /^\s*\d+\.\s+/.test(l); })){
          return '<ol class="doc-ol">'+lines.map(function(l){ return '<li>'+l.replace(/^\s*\d+\.\s+/,'')+'</li>'; }).join('')+'</ol>';
        }
        return '<p>'+block.replace(/\n/g,'<br>')+'</p>';
      }).join('');
    }
